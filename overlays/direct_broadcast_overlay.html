<style>

.feed-line.g-recent { color: #fcd34d; border-color: #f59e0b; }

.feed-line.g-ab { color: #f0abfc; border-color: #d946ef; font-weight: 950; }
.feed-line.g-live { color: #86efac; border-color: #22c55e; }
.feed-line.g-drop { color: #fdba74; border-color: #f97316; }

}

.summary-line.sum-head { color: #67e8f9; background: rgba(8, 51, 68, .72); }

}

@keyframes genSpin { to { transform: rotate(360deg); } }
.work-bar { align-self: stretch; background: linear-gradient(180deg, #f97316, #facc15); border-radius: 5px 0 0 5px; }
.work-copy { min-width: 0; }
.work-title { font-size: 20px; font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work-body { margin-top: 4px; color: #fed7aa; font-size: 12px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work-elapsed { color: #fdba74; font: 900 14px/1 "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
#toast-grid {
  height: 73px;

  grid-template-columns: repeat(3, minmax(0, 1fr));

}

.toast-bar { background: #8ab4ff; }

.toast-title { min-width: 0; flex: 1; font-size: 11.5px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.toast-body { margin-top: 5px; color: #c9daea; font-size: 10px; font-weight: 650; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

@keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* Approved preview v2 (941edb59): reuse its flat panels, palette and rail spacing.
   The live feed/parser/health contract and three surface rectangles stay intact.
   Do not add mock services or logs: the production feeds remain authoritative. */
:root { --cyan: #8ce5f0; --blue: #75daec; --muted: #829aae; --line: #36566b; }
html, body { color: #deedf7; font-family: "Noto Sans JP", "Segoe UI", sans-serif; font-synthesis: none; }
#broadcast-sidebar { padding: 8px; background: #040e17; }
.feed-head { height: 28px; padding: 0 5px; border-bottom-color: #33566c; color: #a5e6f3; font-size: 12px; font-weight: 600; letter-spacing: .07em; }
.live-dot { width: 6px; height: 6px; background: #34e6ad; box-shadow: none; }
#feed-label { font-size: 8px; color: #91abc0; }
#feed-age { color: #91b3cc; }
#feed { width: 303px; height: 642px; gap: 7px; }
.feed-panel { border: 1px solid #36566b; background: #040e17; }
.feed-panel + .feed-panel { padding-top: 0; border-top: 1px solid #36566b; }
.panel-head { height: 25px; gap: 6px; padding: 0 8px; border-bottom: 1px solid #36566b; color: #8ce5f0; }
.badge { padding: 0; border: 0; border-radius: 0; background: transparent; font-size: 10px; color: #8ce5f0; }
.panel-name { color: #91abc0; font-size: 8px; }
.panel-meta { color: #829aae; font-size: 8px; }
.feed-lines, .feed-line { width: 301px; }
/* Keep dense all-line feeds until their structured status/log contract exists. */
.feed-line { min-height: 0; padding-left: 5px; border-left: 0; text-shadow: none; }
.feed-foot { color: #7896aa; font-size: 7px; font-weight: 500; }
#top-rail, #bottom-rail { padding: 8px; background: #020b13; border-color: #2d596c; }
#bottom-rail { padding: 7px 8px; }
#summary { height: 73px; gap: 6px 7px; }
.summary-line { border: 1px solid #325e77; border-radius: 4px; background: #051422; font-weight: 500; }
.summary-line[class] { background: #051422; }
#work, #gen-top { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 8px 12px; border-radius: 4px; border-color: #a77727; background: #171206; color: #f6c564; }
.work-bar, #gen-top .gen-top-bar, .toast-bar { display: none; }
.work-title { color: #f6f0dc; font-size: 21px; font-weight: 700; line-height: 1.4; }
.work-body, #gen-top .gen-top-body { margin-top: 2px; color: #e0d5bd; font-size: 12px; font-weight: 400; line-height: 1.5; white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
/* Keep a 21px title and two readable body lines inside the fixed 73px card. */
#work { padding-top: 4px; padding-bottom: 4px; }
.work-title { line-height: 1.2; }
.work-body { line-height: 1.4; }
.work-elapsed, #gen-top .gen-top-elapsed { align-self: stretch; display: flex; align-items: center; border-left: 1px solid #715926; padding-left: 12px; color: #f6c564; font-size: 24px; font-weight: 500; }
#gen-top .gen-top-title { color: #f6f0dc; font-weight: 700; }
#toast-grid { height: 75px; gap: 7px; }
.toast { grid-template-columns: minmax(0, 1fr); background: #051422; border: 1px solid #325e77; border-radius: 4px; box-shadow: none; }
.toast-copy { padding: 0; }

/* Structured broadcast dashboard. Raw status feeds remain the source of truth,
   but Soren91/JEV and OPS are projected into a scannable 320px surface. */
.game-dashboard,
.ops-dashboard {
  height: 100%;

  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
}
.dash-eyebrow {

  font-size: 8px;

}
.game-title-row,

}
.game-title {

}

.game-kpis,

/* Use one content inset for every game and health view. */
.feed-head { display: none; }
#feed { margin-top: 0; height: 680px; }
html[data-prediction-active="1"] #feed { margin-top: 8px; height: 616px; }
.feed-lines:has(.hanjuku-card) { padding: 0; }
.hanjuku-card { width: 100%; padding: 5px 2px 0; background: transparent; }
.hanjuku-card.stale { background: transparent; }
/* Prioritize the game state over automation telemetry. */
.hanjuku-card { font-family: system-ui, sans-serif; }
.hanjuku-period { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 7px; }
.hanjuku-chapter { font-size: 26px; line-height: 1.2; letter-spacing: 0; }
.hanjuku-month { margin: 0; font-size: 12px; }
.hanjuku-kpis { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin-top: 14px; margin-bottom: 16px; }
.hanjuku-kpi:nth-child(1) { order: 0; }
.hanjuku-kpi:nth-child(2) { order: 2; }
.hanjuku-kpi:nth-child(3) { order: 1; }
.hanjuku-label { white-space: nowrap; }
.hanjuku-detail-row + .hanjuku-detail-row { margin-top: 5px; }
.hanjuku-details { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; color: #edf5fb; font-size: 18px; line-height: 1.35; }
.hanjuku-group { min-width: 0; }
.hanjuku-group-title { margin-bottom: 4px; color: #bdcdd9; font-size: 14px; font-weight: 600; }
.hanjuku-detail-row { display: block; margin-top: 0; }
.hanjuku-detail-label { margin-bottom: 3px; color: #bdcdd9; font-size: 14px; }
.hanjuku-detail-row > :last-child { min-width: 0; overflow-wrap: anywhere; }
.hanjuku-troops { color: #f7fafc; font-size: 24px; font-weight: 700; line-height: 1.15; }
.hanjuku-castles, .hanjuku-orders { color: #deedf7; font-size: 16px; }
.hanjuku-records { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.hanjuku-note { font-size: 11px; line-height: 1.4; color: #bdcdd9; }
.hanjuku-kpi { padding: 0; border: 0; background: transparent; }
.hanjuku-label { color: #bdcdd9; font-size: 12px; }
.hanjuku-value, .hanjuku-kpi:nth-child(2) .hanjuku-value { font-size: 24px; line-height: 1.25; }
.hanjuku-status { padding: 0; border: 0; background: transparent; font-size: 17px; }
.hanjuku-duel { padding: 0; border: 0; background: transparent; font-size: 18px; line-height: 1.35; }
/* Game details are distinct cards, without decorative edge accents. */
.hanjuku-details { gap: 6px; }
.hanjuku-group, .hanjuku-detail-row, .hanjuku-duel {
  box-sizing: border-box; padding: 7px 10px; border: 1px solid #28404f;
  border-radius: 7px; background: #0b1c28;
}

.hanjuku-duel { background: #211b26; border-color: #493341; }
.hanjuku-holds, .hanjuku-garrison, .hanjuku-marching {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;

}

.hanjuku-records > div { padding: 0; }
.ops-kpis { grid-template-columns: minmax(0, 1fr); }

.monitor-section-body { font-weight: 500; padding: 5px 6px; color: #a8d6cc; font-size: 8px; line-height: 10px; white-space: pre; }
.monitor-section-body > div { min-height: 10px; }
.monitor-section[data-kind="timeline"] .monitor-section-body { color: #e7bf75; }
.monitor-section[data-kind="distribution"] .monitor-section-body { color: #93ddd0; }
.monitor-section[data-kind="strategy"] .monitor-section-head { color: #e3c97d; }
.monitor-section[data-kind="observer"] .monitor-section-body,
.monitor-section[data-kind="events"] .monitor-section-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 9px; line-height: 12px; }
.monitor-section[data-kind="events"] .monitor-section-head { color: #edca7f; }
.monitor-chart { width: max-content; transform-origin: left top; }
.monitor-section[data-kind="observer"] .monitor-section-body > div + div { margin-top: 4px; }

.monitor-section[data-kind="events"] .monitor-section-body > div + div { margin-top: 3px; }
.feed-foot { padding: 0 3px; color: #7896aa; font-size: 7px; font-weight: 600; }

/* Dedicated surface behind the native game window. It draws only measured padding. */
#hanjuku-gap { display: none; position: absolute; top: 90px; height: 540px;
  padding: 12px; background: #040e17; overflow: hidden; font-family: system-ui,sans-serif; }
.hanjuku-gap-title { font-size: 15px; color: #bdcdd9; margin-bottom: 8px; }
#hanjuku-gap .hanjuku-group { font-size: 18px; line-height: 1.4; margin-bottom: 8px;
  overflow-wrap: anywhere; white-space: normal; }
#hanjuku-gap .hanjuku-gap-pages { position: absolute; bottom: 8px; font-size: 14px; color: #bdcdd9; }
html[data-soren-region="game-gap"], html[data-soren-region="game-gap"] body,
html[data-soren-region="game-gap"] #broadcast-overlay { width: 960px; height: 540px; }
html[data-soren-region="game-gap"] #hanjuku-gap { top: 0; }
html[data-soren-region="game-gap"] .rail,
html[data-soren-region="game-gap"] #broadcast-sidebar { display: none; }
html[data-soren-region="sidebar"] #hanjuku-gap,
html[data-soren-region="top"] #hanjuku-gap,
html[data-soren-region="bottom"] #hanjuku-gap { display: none !important; }

</style>
</head>
<body>
<main id="broadcast-overlay" data-broadcast-overlay-version="4">
  <section id="hanjuku-gap" aria-label="半熟英雄の観測詳細"></section>
  <section id="top-rail" class="rail" aria-live="polite">
    <div id="summary"></div>
    <div id="work">
      <div class="work-bar"></div>
      <div class="work-copy"><div class="work-title"></div><div class="work-body"></div></div>
      <div class="work-elapsed"></div>
    </div>
    <div id="gen-top" aria-live="polite">
      <div class="gen-top-bar"></div>
      <div class="gen-top-copy"><div class="gen-top-title"><span class="gen-top-spinner"></span><span class="gen-top-label">💬 コメント生成中</span></div><div class="gen-top-body">AIがコメントを生成しています…</div></div>
      <div class="gen-top-elapsed"></div>
    </div>
  </section>
  <section id="bottom-rail" class="rail" aria-live="polite"><div id="toast-grid"></div></section>
  <aside id="broadcast-sidebar">
    <div class="feed-head"><span id="feed-label">GAME + OPS</span><span id="feed-age">--</span></div>
    <section id="prediction-round" aria-label="チャネルポイント予想" aria-live="polite"></section>
    <div id="feed">
      <section class="feed-panel panel-g">
        <div class="panel-head"><span class="badge badge-g">GAME</span><span class="panel-name">GAME STATS</span><span class="panel-state info" id="feed-g-state">LIVE</span><span class="panel-meta" id="feed-g-lines">0L</span></div>
        <div class="feed-lines" id="feed-g"></div>
      </section>
      <section class="feed-panel panel-s">
        <div class="panel-head"><span class="badge badge-s">OPS</span><span class="panel-name">OPS HEALTH</span><span class="panel-state" id="feed-s-state">CHECK</span><span class="panel-meta" id="feed-s-lines">0L</span></div>
        <div class="feed-lines" id="feed-s"></div>
        <div id="monitor-observer" aria-hidden="true"></div>
      </section>
      <section class="feed-panel panel-i">
        <div class="panel-head"><span class="badge badge-i">AI</span><span class="panel-name">IMPROVE</span><span class="panel-status" id="feed-i-status"></span><span class="panel-meta" id="feed-i-lines">0L</span></div>
        <div class="feed-lines" id="feed-i"></div>
      </section>
    </div>
    <div class="feed-foot"><span>STATUS MERGE · READ ONLY</span><span id="feed-progress">0L</span></div>
  </aside>
</main>
<script>
(() => {
  'use strict';
  const STATE_ROUTE = '/__soren_overlay/broadcast/state';
  const TOAST_PAGE_MS = 3000;
  const TOASTS_PER_PAGE = 3;
  const SURFACE_REGION = document.documentElement.dataset.sorenRegion || 'full';
  const feedG = document.getElementById('feed-g');
  const feedS = document.getElementById('feed-s');
  const feedI = document.getElementById('feed-i');
  const feedGLines = document.getElementById('feed-g-lines');
  const feedSLines = document.getElementById('feed-s-lines');
  const feedGState = document.getElementById('feed-g-state');
  const feedSState = document.getElementById('feed-s-state');
  const feedILines = document.getElementById('feed-i-lines');
  const feedIStatus = document.getElementById('feed-i-status');
  const feedLabel = document.getElementById('feed-label');
  const feedAge = document.getElementById('feed-age');
  const feedProgress = document.getElementById('feed-progress');
  const summary = document.getElementById('summary');
  const work = document.getElementById('work');
  const toastGrid = document.getElementById('toast-grid');
  let state = null;
  let lastFeedGKey = '';
  const MONITOR_VIEW_MS = 45000;
  const monitorMotion = { startedAt: null, lastTick: null, frame: null,
    upper: { position: 0, direction: 1, waitUntil: 0 },
    observer: { position: 0, direction: 1, waitUntil: 0 } };
  let lastFeedSKey = '';
  let lastFeedIKey = '';
  let lastSummaryKey = '';
  let lastToastKey = '';

  function pad(value) { return String(value).padStart(2, '0'); }
  function timeLabel(epoch) {
    const date = new Date(Number(epoch || Date.now() / 1000) * 1000);
    return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  }
  function elapsedLabel(epoch) {
    const seconds = Math.max(0, Math.floor(Date.now() / 1000) - Number(epoch || 0));
    return `${Math.floor(seconds / 60)}:${pad(seconds % 60)}`;
  }
  function ageLabel(epoch) {
    const seconds = Math.max(0, Math.floor(Date.now() / 1000) - Number(epoch || 0));
    return seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m`;
  }
  function feedLineClass(line, opts = {}) {
    const raw = String(line || '');
    const text = raw.replace(/^[│┃\s]+/, '');
    if (/^━+$/.test(raw) || /^[┌└]─+[┐┘]$/.test(raw)) return 'dim';
    if (/^  (?:CORE|HEALTH)$/.test(raw)) return 's-health';
    if (/^  ACTIVITY$/.test(raw)) return 's-activity';
    if (/^  AUDIO$/.test(raw)) return 's-audio';
    if (/^  TWITCH$/.test(raw)) return 's-twitch';
    if (/^  YOUTUBE$/.test(raw)) return 's-youtube';
    if (/^  ROLLBACKS$/.test(raw)) return 's-rollback';
    if (/^│? *SOREN[/]|^│? *Best:|^│? *Avg:/.test(raw)) return 'g-head';
    if (/^Score (Timeline|Distribution)/.test(text) || /^Strategy Comparison/.test(text)) return 'g-section';
    if (/^rk hash/.test(text)) return 'g-head';
    if (/^Stats:/.test(text)) return 'game-primary';
    if (/^Trend:/.test(text) || /^wins=/.test(text)) return 'game-trend';
    if (/Workers\s+.*\bONLINE\b/.test(text) || /^Backend\s+.*(?:LIVE|OBS|OK)/.test(text)) return 'ops-primary';
    if (/\b(?:STOPPED|DOWN|FAILED|INVALID)\b/.test(text) || /Duplicates\s+DETECTED/.test(text)) return 'down ops-alert';
    if (/\b(?:DEGRADED|CHECK|UNKNOWN|PAUSED)\b/.test(text) || /^(?:Stopped|Unexpected|Paused|AI 429)\b/.test(text)) return 'ops-warn';
    if (/^► 1 /.test(text)) return 'g-top';
    if (/^[0-9][0-9.,k]*[┃│]/.test(text)) return 'g-dist';
    if (/[⠀-⣿]/.test(text)) return 'g-chart';
    if (/^● /.test(text)) return 'run';
    if (/^○ /.test(text)) return 'down';
    if (/^✓ /.test(text)) return 'ok';
    if (/^◉ /.test(text)) return 'amber';
    if (/^◆ /.test(text)) return 'yellow';
    if (/^▾ /.test(text)) return 'orange';
    if (/^▸ /.test(text)) return 'blue';
    if (/^◇ /.test(text)) return 'purple';
    if (/^♪ |^♫ /.test(text)) return 'pink';
    if (/^📻 /.test(text)) return 'teal';
    if (/^⟳ /.test(text)) return 'violet';
    if (/^💬 /.test(text)) return 'indigo';
    if (opts.improve) {
      if (/^\[\d{2}:\d{2}:\d{2}\] \[IMPROVE\]/.test(raw)) return 'teal';
      if (/^\[\d{2}:\d{2}:\d{2}\] \[(PIN|BRANCH)\]/.test(raw)) return 'purple';
      if (/^\[\d{2}:\d{2}:\d{2}\] \[(WARN|ERROR)\]/.test(raw)) return 'down';
      if (/FAILED|failed|失敗/.test(text)) return 'down';
    }
    if (/Recent30/.test(text)) return 'g-recent';
    if (/Strategy:/.test(text)) return 'g-strategy';
    if (/A\/B:/.test(text)) return 'g-ab';
    if (/^Live:/.test(text)) return 'g-live';
    if (/LastDrop/.test(text)) return 'g-drop';
    if (/Curr |Reg NO/.test(text)) return 'g-core';
    if (/RUNNING|CONNECTED/.test(text)) return 'run';
    if (/STOPPED/.test(text)) return 'down';
    if (/SILENT|IDLE|empty/.test(text)) return 'idle';
    if (/PASSED|none/.test(text)) return 'ok';
    return 'dim';
  }
  function appendFeedLineContent(row, line, segments) {
    if (!Array.isArray(segments) || !segments.length) {
      row.textContent = line === '' ? ' ' : line;
      return;
    }
    for (const segment of segments) {
      const span = document.createElement('span');
      span.textContent = String(segment?.t ?? '');
      if (segment?.c) span.style.color = String(segment.c);
      if (segment?.b) span.style.fontWeight = '700';
      if (segment?.o) span.style.opacity = String(segment.o);
      row.appendChild(span);
    }
  }
  // サイドバーの SHOW-STATUS-G から「ヘッダーの枠」だけを外す。
  //
  // status_overlay.html の <pre> テキストは 2 役を兼ねている:
  //   * 上部 4 枠 (selectedSummaryLines) が SOREN/OBS / A/B: / Recent30: /
  //     Strategy: を拾う供給元
  //   * このサイドバーがそのまま行として描画する中身
  // 供給元としては要るが、サイドバーには出したくない (2026-09-10 の指示)。
  // 生成側で消すと上部 4 枠から A/B が消えるので、描画側で落とす。
  // 対象は "SOREN/" を含む行が属する枠 (┌ … └)。AI 429 の枠は残す。
  //
  // segments は行番号で text と対応しているので、同じ範囲を両方から削る。
  // 片方だけ削ると色付けが 1 行ずつずれ、segments を捨てると色が全部消える。
  function headerBoxRange(lines) {
    const head = lines.findIndex((line) => line.includes('SOREN/'));
    if (head < 0) return null;
    let start = head;
    while (start > 0 && !lines[start].includes('\u250c')) {
      start -= 1;
      // A closed preceding box is unrelated to this unboxed corner header.
      if (lines[start].includes('\u2514')) return null;
    }
    if (!lines[start].includes('\u250c')) return null;
    let end = head;
    while (end < lines.length - 1 && !lines[end].includes('\u2514')) end += 1;
    if (!lines[end].includes('\u2514')) return null;
    return [start, end];
  }
  function stripHeaderBox(text, segments) {
    const lines = String(text ?? '').split('\n');
    const range = headerBoxRange(lines);
    const segs = Array.isArray(segments) ? segments : [];
    if (!range) return { text: String(text ?? ''), segments: segs };
    const [start, end] = range;
    const drop = (arr) => arr.slice(0, start).concat(arr.slice(end + 1));
    let keptLines = drop(lines);
    let keptSegs = segs.length ? drop(segs) : segs;
    // 枠を抜いた先頭に残る空行は詰める (segments も同じだけ)。
    while (keptLines.length && keptLines[0].trim() === '') {
      keptLines = keptLines.slice(1);
      if (keptSegs.length) keptSegs = keptSegs.slice(1);
    }
    return { text: keptLines.join('\n'), segments: keptSegs };
  }
  function renderFeedLines(container, text, opts = {}) {
    const segmentLines = Array.isArray(opts.segmentLines) ? opts.segmentLines : [];
    const lines = String(text || 'データを待っています…').split('\n');
    container.replaceChildren(...lines.map((line, index) => {
      const row = document.createElement('div');
      row.className = `feed-line ${feedLineClass(line, opts)}`;
      appendFeedLineContent(row, line, segmentLines[index]);
      return row;
    }));
  }

  function dashNode(className, text) {
    const el = document.createElement('div');
    el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }
  function compactValue(value, fallback = '—') {
    const text = String(value ?? '').trim();
    return text || fallback;
  }
  function parseLast8(text) {
    const match = String(text || '').match(/^Last8:\s+(.+)$/m);
    if (!match) return [];
    return match[1].trim().split(/\s+/).map(value => Number(value.replace(/,/g, '')))
      .filter(Number.isFinite).slice(-8);
  }
  function renderGameDashboard(container, feed) {
    const text = String(feed?.text || '');
    const corner = text.match(/^SOREN\/CORNER:\s*([^/\n]+)\/\s*([^/\n]+)\/\s*(.+)$/m);
    const stats = text.match(/Stats:\s*(\d+)\s+(results|reports)\s*\/\s*best=([^/\n]+)(?:\s*\/\s*Recent30=([^\n]+))?/);
    const consoleRecord = /^Session:/m.test(text) && corner?.[1].trim() === 'RETRO';
    if (!corner || (!stats && !consoleRecord)) return false;

    const root = dashNode('game-dashboard');
    const eyebrow = dashNode('dash-eyebrow', compactValue(corner[1]).toUpperCase());
    root.appendChild(eyebrow);

    const titleRow = dashNode('game-title-row');
    titleRow.appendChild(dashNode('game-title', compactValue(corner[2])));
    const statusText = compactValue(corner[3], 'DATA');
    const statusTone = /進行中|ACTIVE|LIVE/i.test(statusText) ? 'ok'
      : /CONFLICT|INVALID|ERROR|FAIL/i.test(statusText) ? 'down' : 'warn';
    titleRow.appendChild(dashNode(`dash-pill ${statusTone}`, statusText));
    root.appendChild(titleRow);

    const kpis = dashNode('game-kpis');
    for (const [label, value] of [
      [consoleRecord ? 'HISTORY BEST' : 'BEST', compactValue(stats?.[3])],
      [consoleRecord ? 'HISTORY RECENT 30' : 'RECENT 30', compactValue(stats?.[4] || text.match(/Recent30:[^\n]*mean=([^\s]+)/)?.[1])],
    ]) {
      const cell = dashNode('dash-kpi');
      cell.appendChild(dashNode('dash-kpi-label', label));
      cell.appendChild(dashNode('dash-kpi-value', value));
      kpis.appendChild(cell);
    }
    root.appendChild(kpis);

    const live = text.match(consoleRecord ? /^Record:\s*(.+)$/m : /^Live:\s*(.+)$/m)?.[1];
    if (live) root.appendChild(dashNode('game-live', live));
    if (consoleRecord) {
      const details = dashNode('game-records');
      for (const line of text.split('\n').filter(line => /^(Session|Result|Plan|Evidence|Reason):/.test(line)).slice(0, 4)) {
        details.appendChild(dashNode('game-record', line));
      }
      root.appendChild(details);
    }

    const trend = text.match(/^\s*Trend:\s*(.+)$/m);
    const wins = text.match(/^\s*wins=(\d+)\s*\/\s*lower rank is better$/m);
    if (trend) {
      const tone = /\/\s*better\s*$/i.test(trend[1]) ? 'better'
        : /\/\s*worse\s*$/i.test(trend[1]) ? 'worse' : 'flat';
      root.appendChild(dashNode(`game-trend-line ${tone}`, `TREND  ${trend[1]}`));
    } else if (wins) {
      root.appendChild(dashNode('game-trend-line better', `WIN  #1 × ${wins[1]}`));
    }

    const values = parseLast8(text);
    if (values.length) {
      const historyHead = dashNode('game-history-head');
      historyHead.appendChild(dashNode('', 'LAST 8'));
      historyHead.appendChild(dashNode('', wins ? 'LOWER IS BETTER' : 'RECENT'));
      root.appendChild(historyHead);
      const bars = dashNode('game-bars');
      const lowerBetter = Boolean(wins) || /Rank Timeline/.test(text);
      const lo = Math.min(...values), hi = Math.max(...values);
      const span = Math.max(1, hi - lo);
      values.forEach(value => {
        const quality = lowerBetter ? (hi - value) / span : (value - lo) / span;
        const wrap = dashNode('game-bar-wrap');
        const bar = dashNode('game-bar');
        bar.style.height = `${Math.round(8 + quality * 30)}px`;
        wrap.appendChild(bar);
        wrap.appendChild(dashNode('game-bar-label', value));
        bars.appendChild(wrap);
      });
      root.appendChild(bars);
    }

    container.replaceChildren(root);
    return true;
  }
  function renderSorenMonitor(container, feed, view) {
    const raw = String(feed?.text || '');
    if (!/SOREN\/(?:OBS|FFMPEG)\b/.test(raw)
        || !/Strategy Comparison/.test(raw) || !/Score Timeline/.test(raw)) return false;
    const root = dashNode('soren-monitor');
    const header = dashNode('monitor-header', 'SOREN');
    const tag = document.createElement('span'); tag.textContent = 'TELEMETRY';
    header.appendChild(tag); root.appendChild(header);
    let section = null;
    let kind = '';
    const lines = String(view.text || '').split('\n');
    const addSection = (kind, title, meta = '') => {
      const card = dashNode('monitor-section'); card.dataset.kind = kind;
      const head = dashNode('monitor-section-head', title);
      if (meta) { const caption = document.createElement('small'); caption.textContent = meta; head.appendChild(caption); }
      const body = dashNode('monitor-section-body');
      card.appendChild(head); card.appendChild(body); root.appendChild(card);
      return body;
    };
    lines.forEach((line, index) => {
      const title = line.trim().match(/^(Score Timeline|Score Distribution|Strategy Comparison|Observer Status)(.*)$/);
      if (title) {
        const names = {'Score Timeline':['timeline','SCORE TRACE'], 'Score Distribution':['distribution','DISTRIBUTION'],
          'Strategy Comparison':['strategy','STRATEGY MATRIX'], 'Observer Status':['observer','OBSERVER']};
        const [nextKind, label] = names[title[1]];
        kind = nextKind;
        section = addSection(kind, label, title[2].trim());
        if (kind === 'timeline') {
          const chart = dashNode('monitor-chart');
          section.appendChild(chart); section = chart;
        }
      } else if (line.trim()) {
        if (!section) { kind = 'events'; section = addSection(kind, 'EVENT LOG'); }
        // The producer's terminal box is chrome, not event data. Keep chart axes.
        if (kind === 'events' && /^[\s┌┐└┘─━│┏┓┗┛┃]+$/.test(line)) return;
        const row = dashNode('');
        const chartText = text => String(text).replace(/[█▓▒░]/g, '=');
        const start = kind === 'events' ? (line.match(/^\s*[│┃]?\s*/)?.[0].length || 0)
          : kind === 'observer' ? (line.match(/^\s*/)?.[0].length || 0) : 0;
        const end = kind === 'events' ? line.length - (line.match(/\s*[│┃]\s*$/)?.[0].length || 0) : line.length;
        let offset = 0;
        const segments = view.segments?.[index]?.map(segment => {
          const from = offset; offset += String(segment.t).length;
          return {...segment, t: monitorText(chartText(String(segment.t).slice(Math.max(0, start-from), Math.max(0, Math.min(offset,end)-from))))};
        }).filter(segment => segment.t);
        appendFeedLineContent(row, monitorText(chartText(line.slice(start,end))), segments);
        section.appendChild(row);
      }
    });
    container.replaceChildren(root);
    root._sourceText = raw;
    return true;
  }
  function advanceMonitorScroll(viewport, motion, now, elapsed, reduced) {
    if (!viewport) return;
    const limit = Math.max(0, viewport.scrollHeight - viewport.clientHeight);
    if (motion.reduced !== reduced) {
      motion.reduced = reduced; motion.waitUntil = now + (reduced ? MONITOR_VIEW_MS : 8000);
    }
    if (!limit) {
      motion.position = 0; motion.direction = 1; motion.waitUntil = now + (reduced ? MONITOR_VIEW_MS : 8000);
    } else if (now >= motion.waitUntil) {
      // Dense data stays in one viewport. A slow pan replaces whole-page flips;
      // reduced motion uses infrequent non-animated advances instead.
      motion.position += motion.direction * (reduced ? Math.max(12, viewport.clientHeight - 12) : elapsed * 4);
      if (motion.position >= limit || motion.position <= 0) {
        motion.position = Math.max(0, Math.min(limit, motion.position));
        motion.direction *= -1; motion.waitUntil = now + (reduced ? MONITOR_VIEW_MS : 8000);
      } else if (reduced) motion.waitUntil = now + MONITOR_VIEW_MS;
    }
    motion.position = Math.min(limit, motion.position);
    viewport.scrollTop = motion.position;
  }
  function animateSorenMonitor(now = performance.now()) {
    const root = feedG.querySelector('.soren-monitor');
    const slot = document.getElementById('monitor-observer');
    const elapsed = Math.max(0, Math.min(1, (now - (monitorMotion.lastTick ?? now))/1000));
    monitorMotion.lastTick = now;
    if (root && root.getBoundingClientRect().width > 0) {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const observer = slot.querySelector('.monitor-section');
      const view = observer && Math.floor((now-monitorMotion.startedAt)/MONITOR_VIEW_MS)%2 ? 'observer' : 'health';
      if (document.documentElement.dataset.monitorView !== view) document.documentElement.dataset.monitorView = view;
      feedS.ariaHidden = String(view === 'observer');
      slot.ariaHidden = String(view !== 'observer');
      advanceMonitorScroll(root.querySelector('.monitor-viewport'), monitorMotion.upper, now, elapsed, reduced);
      if (view === 'observer') advanceMonitorScroll(slot.querySelector('.monitor-section-body'), monitorMotion.observer, now, elapsed, reduced);
    }
    monitorMotion.frame = requestAnimationFrame(animateSorenMonitor);
  }
  function adaptSorenMonitor(container) {
    const root = container.querySelector('.soren-monitor');
    const slot = document.getElementById('monitor-observer');
    if (!root) {
      if (slot?.children.length) slot.replaceChildren();
      feedS.ariaHidden = 'false';
      if (monitorMotion.frame !== null) cancelAnimationFrame(monitorMotion.frame);
      monitorMotion.frame = null;
      document.documentElement.dataset.monitorView = 'health';
      return;
    }

    if (/\b(?:STOPPED|DOWN|FAILED|INVALID)\b|Duplicates\s+DETECTED/.test(text)) return ['ALERT', 'down'];
    if (/\b(?:DEGRADED|UNKNOWN|PAUSED)\b/.test(text)) return ['CHECK', 'warn'];
    if (/Backend\s+.*(?:FFMPEG LIVE|OBS)|Chat:\s*RUNNING/.test(text)) return ['LIVE', 'ok'];
    return ['OPS', 'info'];
  }

  function renderFeed() {
    const g = state?.feeds?.showStatusG;
    const s = state?.feeds?.showStatus;
    const i = state?.feeds?.improve;
    const improveActive = Boolean(i?.active);
    const [gameStateLabel, gameStateTone] = gamePanelState(g);
    const [opsStateLabel, opsStateTone] = opsPanelState(s);
    setPanelState(feedGState, gameStateLabel, gameStateTone);
    setPanelState(feedSState, opsStateLabel, opsStateTone);
    document.documentElement.dataset.improveActive = improveActive ? '1' : '';
    const hanjuku = hanjukuView(g, Date.now() / 1000);
    if (hanjuku && state.gameGapEnabled !== true) hanjuku.gap = null;
    document.documentElement.dataset.hanjukuActive = hanjuku ? '1' : '';
    renderHanjukuGap(hanjuku);
    const gKey = `${g?.updatedAt || 0}:${g?.text || ''}:${hanjuku?.fresh}:${Boolean(hanjuku?.gap)}`;
    const sKey = `${s?.updatedAt || 0}:${s?.text || ''}`;
    if (gKey !== lastFeedGKey) {
      const gView = stripHeaderBox(g?.text, g?.segments);
      if (hanjuku) renderHanjuku(feedG, hanjuku);
      else if (!renderGameDashboard(feedG, g) && !renderSorenMonitor(feedG, g, gView)) renderFeedLines(feedG, gView.text, { segmentLines: gView.segments });
      document.documentElement.dataset.sorenMonitor = feedG.querySelector('.soren-monitor') ? '1' : '';
      feedGLines.textContent = `${g?.lineCount || 0}L`;
      lastFeedGKey = gKey;
    }
    if (sKey !== lastFeedSKey) {
      if (!renderOpsDashboard(feedS, s)) renderFeedLines(feedS, s?.text);
      feedSLines.textContent = `${s?.lineCount || 0}L`;
      lastFeedSKey = sKey;
    }
    if (improveActive) {
      const iKey = `${i?.updatedAt || 0}:${(i?.logLines || []).join('\n')}`;
      if (iKey !== lastFeedIKey) {
        renderFeedLines(feedI, (i?.logLines || []).join('\n') || '改善ログを待機中…', { improve: true });
        feedILines.textContent = `${i?.lineCount || 0}L`;
        feedIStatus.textContent = [i?.status, i?.phase, i?.detail]
          .filter(Boolean).join(' · ') || 'running';
        lastFeedIKey = iKey;
      }
      feedLabel.textContent = 'IMPROVE + OPS';
    } else {
      if (lastFeedIKey !== '') {
        feedI.replaceChildren();
        feedILines.textContent = '0L';
        feedIStatus.textContent = '';
        lastFeedIKey = '';
      }
      feedLabel.textContent = 'GAME + OPS';
    }
    feedAge.textContent = ageLabel(Math.max(
      g?.updatedAt || 0,
      s?.updatedAt || 0,
      improveActive ? (i?.logUpdatedAt || 0) : (i?.updatedAt || 0),
    ));
    feedProgress.textContent = `${(g?.lineCount || 0) + (s?.lineCount || 0) + (improveActive ? (i?.lineCount || 0) : 0)}L`;
    adaptSorenMonitor(feedG);
    adaptOpsDashboard(feedS);
    // Raw feeds retain every source row. New panel chrome must not push the last
    // rows below the frame; fit leading/type to the actual remaining height.
    // Structured Hanjuku cards keep their natural height and all observations.
    for (const container of [feedG, feedS, feedI]) {
      if (container.querySelector('.game-dashboard,.ops-dashboard,.hanjuku-card')) {
        container.style.fontSize = '';
        container.style.lineHeight = '';
        continue;
      }
      const rows = container.querySelectorAll('.feed-line');
      const panel = container.parentElement;
      const headerHeight = panel?.querySelector('.panel-head')?.offsetHeight;
      const available = panel?.clientHeight - headerHeight;
      if (!rows.length || !Number.isFinite(available) || available <= 0) continue;
      const leading = Math.min(13.05, available / rows.length);
      container.style.fontSize = `${Math.min(9, leading / 1.16)}px`;
      container.style.lineHeight = `${leading}px`;
    }
  }
  function summaryClass(text) {
    if (/A\/B\s*残り:/.test(text)) return 'sum-ab';
    if (/A\/B:/.test(text)) return 'sum-ab';
    if (/^SOREN\b/.test(text)) return 'sum-head';
    if (/Recent30/.test(text)) return 'sum-recent';
    if (/Strategy/.test(text)) return 'sum-strategy';
    if (/^Live:/.test(text)) return 'sum-live';
    if (/Backend/.test(text)) return 'sum-backend';
    if (/AI(?: 429|使用量上限)/.test(text)) return 'sum-ai';
    if (/Game|Queued/.test(text)) return 'sum-queue';
    if (/LastDrop/.test(text)) return 'sum-drop';
    if (/AVSync/.test(text)) return 'sum-av';
    return 'sum-muted';
  }
  // status_dashboard の A/B「あと何試合」行 (例:
  // "      k13/19  adopt-look in 24g  max 96g  score") を上部レール向けの
  // 短い1行に整形する。生の行が無い・数値が読めないときは null を返す。
  function abRemainingSummary(stats) {
    const raw = (Array.isArray(stats) ? stats : []).find((line) =>
      /(?:adopt-look in \d+g|no adopt-look left)/.test(String(line)));
    if (!raw) return null;
    const clean = String(raw).replace(/[│┌┐└┘─━]/g, '').trim();
    const look = clean.match(/\bk(\d+)\/(\d+)\b/);
    const adopt = clean.match(/adopt-look in (\d+)g/);
    const max = clean.match(/max (\d+)g/);
    let text = 'A/B 残り:';
    if (adopt && max) text += ` あと${adopt[1]}〜${max[1]}試合`;
    else if (adopt) text += ` あと${adopt[1]}試合`;
    else if (max) text += ` 最長${max[1]}試合`;
    else return null;
    if (look) text += ` k${look[1]}/${look[2]}`;
    return text;
  }
  function selectedSummaryLines() {
    const stats = String(state?.feeds?.showStatusG?.text || '').split('\n');
    const ops = String(state?.feeds?.showStatus?.text || '').split('\n');
    const pick = (pattern) => stats.find((line) => pattern.test(line));
    // ヘッダーは箱付きで来るので先頭の │ を前提にしない (SOREN/FFMPEG も拾う)。
    const head = pick(/SOREN\//);
    const abLine = pick(/A\/B:/);
    const abLeft = abLine ? abRemainingSummary(stats) : null;
    let selected;
    if (abLine) {
      // A/B 進行中は Live を譲り、「あと何試合か」を1枠使う。Strategy 行は A の
      // hash と重複するのでその間は落とす (上部の枠は4つだけ)。
      selected = [head, abLine, abLeft || pick(/Strategy:/), pick(/Recent30:/)].filter(Boolean);
    } else {
      selected = [head, pick(/Recent30:/), pick(/Strategy:/), pick(/Live:/)].filter(Boolean);
    }
    if (selected.length < 4) {
      for (const pattern of [/Backend/, /Game|Queued/, /LastDrop/, /AVSync/]) {
        const line = ops.find((candidate) => pattern.test(candidate));
        if (line && !selected.includes(line)) selected.push(line);
        if (selected.length >= 4) break;
      }
    }
    return selected.slice(0, 4).map((line) => monitorText(String(line).replace(/[│┌┐└┘─━]/g, '').trim()));
  }
  function renderTopRail() {
    const workState = state?.notifications?.work || {};
    const workActive = Boolean(workState.active);
    const genTop = document.getElementById('gen-top');
    let commentActive = false;
    let cg = null;
    try {
      const gens = Array.isArray(state?.notifications?.generators) ? state.notifications.generators : [];
      cg = gens.find((g) => String(g.key||'') === 'comment') || null;
      commentActive = Boolean(cg);
    } catch { commentActive = false; cg = null; }
    // 作業インジケーター領域にコメント生成中を表示: work優先、次にcomment、最後にサマリ
    if (workActive) {
      work.classList.add('active');
      genTop.classList.remove('active');
      summary.style.display = 'none';
      work.querySelector('.work-title').textContent = workState.title || 'システム作業中';
      work.querySelector('.work-body').textContent = workState.body || '';
      work.querySelector('.work-elapsed').textContent = elapsedLabel(workState.ts);
      // work中でもコメント生成中なら work の body に追記で示す
      if (commentActive) {
        const bodyEl = work.querySelector('.work-body');
        if (bodyEl && cg) bodyEl.textContent = `${workState.body || ''}  |  ${cg.icon || '💬'} ${cg.label || 'コメント生成中'} ${elapsedLabel(cg.ts)}`.trim();
      }
    } else if (commentActive) {
      work.classList.remove('active');
      summary.style.display = 'none';
      genTop.classList.add('active');
      const labelEl = genTop.querySelector('.gen-top-label');
      if (labelEl) labelEl.textContent = `${cg.icon || '💬'} ${cg.label || 'コメント生成中'}`;
      const elapsedEl = genTop.querySelector('.gen-top-elapsed');
      if (elapsedEl) elapsedEl.textContent = elapsedLabel(cg.ts);
    } else {
      work.classList.remove('active');
      genTop.classList.remove('active');
      summary.style.display = 'grid';
      const topO = state?.topOverride;
      if (topO && topO.enabled === false) {
        summary.style.display = 'none';
        return;
      }
      const lines = (topO && topO.enabled === true && Array.isArray(topO.lines) && topO.lines.length)
        ? topO.lines.slice(0, 4).map((s) => String(s).trim()).filter(Boolean)
        : selectedSummaryLines();
      const key = JSON.stringify(lines);
      if (key !== lastSummaryKey) {
        summary.replaceChildren(...lines.map((text) => {
          const row = document.createElement('div');
          row.className = `summary-line ${summaryClass(text)}`;
          row.textContent = text;
          return row;
        }));
        lastSummaryKey = key;
      }
    }
  }
  function monitorText(text) {
    return text.replace(/\bBackend\s+(?:FFMPEG|OBS)\s*/g, '配信 ')
      .replace(/\bSOREN\/(?:FFMPEG|OBS)\b/g, 'SOREN');
  }
  function liveStatusCards() {
    const ops = String(state?.feeds?.showStatus?.text || '').split('\n');
    return [/Backend/, /Game|Queued/, /LastDrop/].map((pattern) => ops.find((line) => pattern.test(line)))
      .filter(Boolean).map((line) => ({
        category: 'system',
        title: 'LIVE STATUS',
        body: monitorText(line.trim()),
        ts: 0,
        liveStatus: true,
      }));
  }
  function aiThinkingCard(generators) {
    const labels = generators.map((item) => String(item.label || '').trim()).filter(Boolean).sort();
    return {
      category: 'ai-thinking',
      title: 'AI思考中',
      body: labels.join(' / ') || '生成処理を実行中',
      liveStatus: true,
    };
  }
  function currentToasts() {
    const now = Math.floor(Date.now() / 1000);
    const visibleSec = Number(state?.notifications?.visibleSec || 18);
    const events = (Array.isArray(state?.notifications?.events) ? state.notifications.events : [])
      .filter((item) => now - Number(item.ts || 0) <= visibleSec);
    const rawGenerators = Array.isArray(state?.notifications?.generators) ? state.notifications.generators : [];
    const generatorEvents = rawGenerators.map((item) => ({
      category: item.key || 'worker',
      title: `${item.icon || '⏳'} ${item.label || '生成中'}`,
      body: `処理継続中 ${elapsedLabel(item.ts)}`,
      ts: item.ts || now,
    }));
    if (!events.length && rawGenerators.length) {
      // AI思考中は下枠の先頭カードを思考中表示へ置き換え、LIVE STATUS は2枚へ圧縮する。
      return [aiThinkingCard(rawGenerators), ...liveStatusCards().slice(0, TOASTS_PER_PAGE - 1)];
    }
    const displayItems = [...generatorEvents, ...events];
    if (!displayItems.length) {
      return liveStatusCards();
    }
    const pageCount = Math.max(1, Math.ceil(displayItems.length / TOASTS_PER_PAGE));
    const page = Math.floor(Date.now() / TOAST_PAGE_MS) % pageCount;
    return displayItems.slice(page * TOASTS_PER_PAGE, (page + 1) * TOASTS_PER_PAGE);
  }
  function renderToasts() {
    const items = currentToasts();
    const key = JSON.stringify(items.map((item) => item.liveStatus
      ? ['live-status', item.category, item.title, item.body]
      : [item.ts, item.category, item.title, item.body]));
    const now = Math.floor(Date.now() / 1000);
    if (key === lastToastKey) {
      // 既定 LIVE STATUS カードは再構築せず時計だけ進め、enter アニメーションの再実行を防ぐ。
      for (const card of toastGrid.querySelectorAll('.toast[data-live-status="1"]')) {
        const time = card.querySelector('.toast-time');
        if (time) time.textContent = timeLabel(now);
      }
      return;
    }
    toastGrid.replaceChildren(...items.map((item) => {
      const category = String(item.category || 'system').toLowerCase().replace(/[^a-z0-9_-]/g, '');
      const card = document.createElement('article');
      card.className = `toast ${category}${!item.liveStatus && now - Number(item.ts || 0) <= 3 ? ' fresh' : ''}`;
      if (item.liveStatus) card.dataset.liveStatus = '1';
      const bar = document.createElement('div');
      bar.className = 'toast-bar';
      const copy = document.createElement('div');
      copy.className = 'toast-copy';
      const head = document.createElement('div');
      head.className = 'toast-head';
      const title = document.createElement('div');
      title.className = 'toast-title';
      title.textContent = item.title || item.category || 'event';
      const time = document.createElement('div');
      time.className = 'toast-time';
      time.textContent = item.liveStatus ? timeLabel(now) : timeLabel(item.ts);
      const body = document.createElement('div');
      body.className = 'toast-body';
      body.textContent = item.body || '';
      head.append(title, time);
      copy.append(head, body);
      card.append(bar, copy);
      return card;
    }));
    lastToastKey = key;
  }
  function publishHealth(error = '') {
    window.__sorenBroadcastOverlayHealth = {
      version: 3,
      updatedAt: state?.updatedAt || 0,
      lastClientUpdateAt: Math.floor(Date.now() / 1000),
      showStatusGLineCount: state?.feeds?.showStatusG?.lineCount || 0,
      showStatusLineCount: state?.feeds?.showStatus?.lineCount || 0,
      improveActive: Boolean(state?.feeds?.improve?.active),
      improveLineCount: state?.feeds?.improve?.lineCount || 0,
      feedLines: (state?.feeds?.showStatusG?.lineCount || 0)
        + (state?.feeds?.showStatus?.lineCount || 0)
        + (state?.feeds?.improve?.active ? (state?.feeds?.improve?.lineCount || 0) : 0),
      notificationCount: state?.notifications?.events?.length || 0,
      workActive: Boolean(state?.notifications?.work?.active),
      generatorCount: state?.notifications?.generators?.length || 0,
      merged: true,
      error,
      region: SURFACE_REGION,
      layout: { game: [0, 90, 960, 540], sidebar: [960, 0, 320, 720], rails: [90, 90] },
    };
  }
  function renderPrediction() {
    const lines = String(state?.feeds?.showStatus?.text || '').split('\n').map(line => line.trim());
    const progress = lines.find(line => line.startsWith('予想対象：'));
    const current = lines.find(line => /^#\d+：今回の予想対象/.test(line));
    document.documentElement.dataset.predictionActive = progress ? '1' : '0';
    const panel = document.getElementById('prediction-round');
    const text = progress ? progress.replace('｜終了', '\n終了') + (current ? '\n' + current : '') : '';
    if (panel.textContent !== text) { panel.textContent = text; panel.style.whiteSpace = 'pre-line'; }
  }
  function render() {
    renderPrediction();
    if (!state) return;
    renderFeed();
    renderTopRail();
    renderToasts();
    publishHealth();
  }
  async function refresh() {
    try {
      if (window.parent !== window && window.parent?.__sorenBroadcastState) {
        state = window.parent.__sorenBroadcastState;
        render();
        return;
      }
      const response = await fetch(STATE_ROUTE, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      state = await response.json();
      render();
    } catch (error) {
      publishHealth(String(error?.message || error));
    }
  }
  void refresh();
  setInterval(refresh, 1000);
  setInterval(render, 1000);
})();
</script>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280,height=720,initial-scale=1">
<title>Soren direct broadcast overlay</title>
<script>
document.documentElement.dataset.sorenRegion = window.frameElement?.dataset.sorenOverlayRegion || 'full';
</script>
<style>
:root {
  color-scheme: dark;
  --cyan: #67e8f9;
  --blue: #38bdf8;
  --muted: #91a4ba;
  --line: rgba(103, 232, 249, .23);
  --panel: rgba(3, 10, 22, .94);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 1280px;
  height: 720px;
  overflow: hidden;
  color: #eaf7ff;
  background: transparent;
  font-family: Inter, "Noto Sans JP", "Segoe UI", sans-serif;
}
#broadcast-overlay {
  position: fixed;
  inset: 0;
  width: 1280px;
  height: 720px;
  overflow: hidden;
  pointer-events: none;
}
html[data-soren-region="sidebar"],
html[data-soren-region="sidebar"] body,
html[data-soren-region="sidebar"] #broadcast-overlay {
  width: 320px;
  height: 720px;
}
html[data-soren-region="sidebar"] #broadcast-sidebar { left: 0; }
html[data-soren-region="sidebar"] .rail { display: none; }
html[data-soren-region="top"],
html[data-soren-region="top"] body,
html[data-soren-region="top"] #broadcast-overlay,
html[data-soren-region="bottom"],
html[data-soren-region="bottom"] body,
html[data-soren-region="bottom"] #broadcast-overlay {
  width: 960px;
  height: 90px;
}
html[data-soren-region="top"] #broadcast-sidebar,
html[data-soren-region="top"] #bottom-rail,
html[data-soren-region="bottom"] #broadcast-sidebar,
html[data-soren-region="bottom"] #top-rail { display: none; }
html[data-soren-region="bottom"] #bottom-rail { top: 0; }
#broadcast-sidebar {
  position: absolute;
  left: 960px;
  top: 0;
  width: 320px;
  height: 720px;
  padding: 8px 7px 7px;
  background: linear-gradient(180deg, rgba(4, 13, 28, .97), rgba(2, 8, 18, .97));
  border-left: 1px solid var(--line);
  overflow: hidden;
}
.feed-head {
  height: 30px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 5px 6px;
  border-bottom: 1px solid var(--line);
  color: var(--cyan);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .12em;
}
.live-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 10px rgba(34, 197, 94, .8);
}
#feed-label { margin-left: auto; color: #c8d7e6; letter-spacing: .04em; }
#feed-age { color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0; }
#feed {
  margin: 6px 0 0;
  width: 306px;
  height: 642px;
  overflow: hidden;
  white-space: pre;
  color: #d9edff;
  font: 8.45px/10.35px "SF Mono", Menlo, Consolas, "Noto Sans Mono", monospace;
  letter-spacing: 0;
  text-shadow: 0 1px 0 rgba(0, 0, 0, .75);
}
.feed-foot {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 7px;
  height: 16px;
  display: flex;
  align-items: center;
  color: #60758b;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .08em;
}
#feed-progress { margin-left: auto; font-variant-numeric: tabular-nums; }
.rail {
  position: absolute;
  left: 0;
  width: 960px;
  overflow: hidden;
}
#top-rail {
  top: 0;
  height: 90px;
  padding: 8px 9px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(4, 13, 28, .95), rgba(3, 10, 21, .92));
}
#bottom-rail {
  top: 630px;
  height: 90px;
  padding: 8px 9px;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(3, 10, 21, .92), rgba(4, 13, 28, .95));
}
#summary {
  height: 73px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 8px;
}
.summary-line {
  min-width: 0;
  display: flex;
  align-items: center;
  padding: 0 11px;
  color: #dceefe;
  background: rgba(12, 28, 48, .72);
  border: 1px solid rgba(103, 232, 249, .14);
  border-radius: 5px;
  font: 800 12.5px/1.1 "SF Mono", Menlo, Consolas, monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#work {
  height: 73px;
  display: none;
  grid-template-columns: 7px minmax(0, 1fr) auto;
  column-gap: 13px;
  align-items: center;
  padding-right: 14px;
  color: #fff7ed;
  background: rgba(31, 17, 5, .93);
  border: 1px solid rgba(251, 146, 60, .7);
  border-radius: 6px;
}
#work.active { display: grid; }
.work-bar { align-self: stretch; background: linear-gradient(180deg, #f97316, #facc15); border-radius: 5px 0 0 5px; }
.work-copy { min-width: 0; }
.work-title { font-size: 20px; font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work-body { margin-top: 4px; color: #fed7aa; font-size: 12px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work-elapsed { color: #fdba74; font: 900 14px/1 "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
#toast-grid {
  height: 73px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.toast {
  min-width: 0;
  display: grid;
  grid-template-columns: 5px minmax(0, 1fr);
  overflow: hidden;
  color: #eef7ff;
  background: rgba(8, 18, 32, .94);
  border: 1px solid rgba(184, 205, 235, .2);
  border-radius: 6px;
  box-shadow: 0 6px 16px rgba(0, 0, 0, .28);
}
.toast-bar { background: #8ab4ff; }
.toast.game .toast-bar { background: #facc15; }
.toast.worker .toast-bar { background: #38bdf8; }
.toast.chat .toast-bar { background: #a78bfa; }
.toast.radio .toast-bar { background: #22c55e; }
.toast.prediction .toast-bar { background: #fb7185; }
.toast.rollback .toast-bar { background: #f97316; }
.toast-copy { min-width: 0; padding: 7px 8px 6px; }
.toast-head { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.toast-title { min-width: 0; flex: 1; font-size: 11.5px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast-time { color: #72869b; font: 750 8.5px/1 "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
.toast-body { margin-top: 5px; color: #c9daea; font-size: 10px; font-weight: 650; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.fresh { animation: enter .18s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<main id="broadcast-overlay" data-broadcast-overlay-version="2">
  <section id="top-rail" class="rail" aria-live="polite">
    <div id="summary"></div>
    <div id="work">
      <div class="work-bar"></div>
      <div class="work-copy"><div class="work-title"></div><div class="work-body"></div></div>
      <div class="work-elapsed"></div>
    </div>
  </section>
  <section id="bottom-rail" class="rail" aria-live="polite"><div id="toast-grid"></div></section>
  <aside id="broadcast-sidebar">
    <div class="feed-head"><span class="live-dot"></span><span>SOREN DATA</span><span id="feed-label">WAITING</span><span id="feed-age">--</span></div>
    <pre id="feed">配信専用オーバーレイを準備しています…</pre>
    <div class="feed-foot"><span>FULL LEGACY DATA · READ ONLY</span><span id="feed-progress">0/0</span></div>
  </aside>
</main>
<script>
(() => {
  'use strict';
  const STATE_ROUTE = '/__soren_overlay/broadcast/state';
  const FEED_PAGE_MS = 12000;
  const TOAST_PAGE_MS = 3000;
  const FEED_LINES_PER_PAGE = 58;
  const TOASTS_PER_PAGE = 3;
  const SURFACE_REGION = document.documentElement.dataset.sorenRegion || 'full';
  const feed = document.getElementById('feed');
  const feedLabel = document.getElementById('feed-label');
  const feedAge = document.getElementById('feed-age');
  const feedProgress = document.getElementById('feed-progress');
  const summary = document.getElementById('summary');
  const work = document.getElementById('work');
  const toastGrid = document.getElementById('toast-grid');
  let state = null;
  let feedPages = [];
  let lastFeedKey = '';
  let lastSummaryKey = '';
  let lastToastKey = '';

  function pad(value) { return String(value).padStart(2, '0'); }
  function timeLabel(epoch) {
    const date = new Date(Number(epoch || Date.now() / 1000) * 1000);
    return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  }
  function elapsedLabel(epoch) {
    const seconds = Math.max(0, Math.floor(Date.now() / 1000) - Number(epoch || 0));
    return `${Math.floor(seconds / 60)}:${pad(seconds % 60)}`;
  }
  function ageLabel(epoch) {
    const seconds = Math.max(0, Math.floor(Date.now() / 1000) - Number(epoch || 0));
    return seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m`;
  }
  function chunks(text) {
    const lines = String(text || 'データを待っています…').split('\n');
    const result = [];
    for (let index = 0; index < lines.length; index += FEED_LINES_PER_PAGE) {
      result.push(lines.slice(index, index + FEED_LINES_PER_PAGE).join('\n'));
    }
    return result.length ? result : ['データを待っています…'];
  }
  function rebuildFeedPages() {
    const sources = [state?.feeds?.showStatusG, state?.feeds?.showStatus];
    feedPages = [];
    for (const source of sources) {
      const pages = chunks(source?.text);
      pages.forEach((text, index) => feedPages.push({
        label: source?.label || 'UNKNOWN',
        text,
        page: index + 1,
        pages: pages.length,
        updatedAt: source?.updatedAt || 0,
      }));
    }
  }
  function renderFeed() {
    if (!feedPages.length) return;
    const index = Math.floor(Date.now() / FEED_PAGE_MS) % feedPages.length;
    const page = feedPages[index];
    const key = `${index}:${page.updatedAt}:${page.text}`;
    if (key !== lastFeedKey) {
      feed.textContent = page.text;
      feedLabel.textContent = `${page.label} ${page.page}/${page.pages}`;
      feedProgress.textContent = `${index + 1}/${feedPages.length}`;
      lastFeedKey = key;
    }
    feedAge.textContent = ageLabel(page.updatedAt);
  }
  function selectedSummaryLines() {
    const stats = String(state?.feeds?.showStatusG?.text || '').split('\n');
    const ops = String(state?.feeds?.showStatus?.text || '').split('\n');
    const patterns = [/SOREN\/OBS/, /Recent30:/, /Strategy:/, /Live:/];
    const selected = patterns.map((pattern) => stats.find((line) => pattern.test(line))).filter(Boolean);
    if (selected.length < 4) {
      for (const pattern of [/Backend/, /Queued/, /LastDrop/, /AVSync/]) {
        const line = ops.find((candidate) => pattern.test(candidate));
        if (line && !selected.includes(line)) selected.push(line);
        if (selected.length >= 4) break;
      }
    }
    return selected.slice(0, 4).map((line) => line.replace(/[│┌┐└┘─━]/g, '').trim());
  }
  function renderTopRail() {
    const workState = state?.notifications?.work || {};
    const active = Boolean(workState.active);
    work.classList.toggle('active', active);
    summary.style.display = active ? 'none' : 'grid';
    if (active) {
      work.querySelector('.work-title').textContent = workState.title || 'システム作業中';
      work.querySelector('.work-body').textContent = workState.body || '確認・修正・検証を進めています';
      work.querySelector('.work-elapsed').textContent = elapsedLabel(workState.ts);
    } else {
      const lines = selectedSummaryLines();
      const key = JSON.stringify(lines);
      if (key !== lastSummaryKey) {
        summary.replaceChildren(...lines.map((text) => {
          const row = document.createElement('div');
          row.className = 'summary-line';
          row.textContent = text;
          return row;
        }));
        lastSummaryKey = key;
      }
    }
  }
  function currentToasts() {
    const now = Math.floor(Date.now() / 1000);
    const visibleSec = Number(state?.notifications?.visibleSec || 18);
    const events = (Array.isArray(state?.notifications?.events) ? state.notifications.events : [])
      .filter((item) => now - Number(item.ts || 0) <= visibleSec);
    const generatorEvents = (Array.isArray(state?.notifications?.generators)
      ? state.notifications.generators : []).map((item) => ({
      category: item.key || 'worker',
      title: `${item.icon || '⏳'} ${item.label || '生成中'}`,
      body: `処理継続中 ${elapsedLabel(item.ts)}`,
      ts: item.ts || now,
    }));
    const displayItems = [...generatorEvents, ...events];
    if (!displayItems.length) {
      const ops = String(state?.feeds?.showStatus?.text || '').split('\n');
      return [/Backend/, /Queued/, /LastDrop/].map((pattern) => ops.find((line) => pattern.test(line)))
        .filter(Boolean).map((line) => ({
          category: 'system',
          title: 'LIVE STATUS',
          body: line.trim(),
          ts: 0,
          liveStatus: true,
        }));
    }
    const pageCount = Math.max(1, Math.ceil(displayItems.length / TOASTS_PER_PAGE));
    const page = Math.floor(Date.now() / TOAST_PAGE_MS) % pageCount;
    return displayItems.slice(page * TOASTS_PER_PAGE, (page + 1) * TOASTS_PER_PAGE);
  }
  function renderToasts() {
    const items = currentToasts();
    const key = JSON.stringify(items.map((item) => item.liveStatus
      ? ['live-status', item.category, item.title, item.body]
      : [item.ts, item.category, item.title, item.body]));
    const now = Math.floor(Date.now() / 1000);
    if (key === lastToastKey) {
      // 既定 LIVE STATUS カードは再構築せず時計だけ進め、enter アニメーションの再実行を防ぐ。
      for (const card of toastGrid.querySelectorAll('.toast[data-live-status="1"]')) {
        const time = card.querySelector('.toast-time');
        if (time) time.textContent = timeLabel(now);
      }
      return;
    }
    toastGrid.replaceChildren(...items.map((item) => {
      const category = String(item.category || 'system').toLowerCase().replace(/[^a-z0-9_-]/g, '');
      const card = document.createElement('article');
      card.className = `toast ${category}${!item.liveStatus && now - Number(item.ts || 0) <= 3 ? ' fresh' : ''}`;
      if (item.liveStatus) card.dataset.liveStatus = '1';
      const bar = document.createElement('div');
      bar.className = 'toast-bar';
      const copy = document.createElement('div');
      copy.className = 'toast-copy';
      const head = document.createElement('div');
      head.className = 'toast-head';
      const title = document.createElement('div');
      title.className = 'toast-title';
      title.textContent = item.title || item.category || 'event';
      const time = document.createElement('div');
      time.className = 'toast-time';
      time.textContent = item.liveStatus ? timeLabel(now) : timeLabel(item.ts);
      const body = document.createElement('div');
      body.className = 'toast-body';
      body.textContent = item.body || '';
      head.append(title, time);
      copy.append(head, body);
      card.append(bar, copy);
      return card;
    }));
    lastToastKey = key;
  }
  function publishHealth(error = '') {
    window.__sorenBroadcastOverlayHealth = {
      version: 1,
      updatedAt: state?.updatedAt || 0,
      lastClientUpdateAt: Math.floor(Date.now() / 1000),
      showStatusGLineCount: state?.feeds?.showStatusG?.lineCount || 0,
      showStatusLineCount: state?.feeds?.showStatus?.lineCount || 0,
      notificationCount: state?.notifications?.events?.length || 0,
      workActive: Boolean(state?.notifications?.work?.active),
      generatorCount: state?.notifications?.generators?.length || 0,
      feedPages: feedPages.length,
      error,
      region: SURFACE_REGION,
      layout: { game: [0, 90, 960, 540], sidebar: [960, 0, 320, 720], rails: [90, 90] },
    };
  }
  function render() {
    if (!state) return;
    renderFeed();
    renderTopRail();
    renderToasts();
    publishHealth();
  }
  async function refresh() {
    try {
      const response = await fetch(STATE_ROUTE, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      state = await response.json();
      rebuildFeedPages();
      render();
    } catch (error) {
      publishHealth(String(error?.message || error));
    }
  }
  void refresh();
  setInterval(refresh, 1000);
  setInterval(render, 1000);
})();
</script>
</body>
</html>

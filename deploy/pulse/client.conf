# Managed PulseAudio client defaults for the soren runtime host (docich #2008).
# Installed by install_soren_runtime_service.sh to
# /home/ubuntu/.config/pulse/client.conf.
#
# 2026-10-11 05:55/08:05 incidents: a libpulse client inside the
# soren-bgm.service cgroup autospawned a private PulseAudio server. systemd
# later killed that whole cgroup on a deploy restart of soren-bgm, which also
# killed the shared audio server, and every client silently fell back to a
# different socket (/tmp/pulse-*/native) while the encoder kept publishing
# video without audio.
#
# autospawn = no forbids any client library from starting its own server. The
# canonical server is the ubuntu user manager's pulseaudio.socket /
# pulseaudio.service (session.slice), reachable at the default-server below.
# The explicit default-server also re-homes clients that run without
# XDG_RUNTIME_DIR (system services) onto the canonical socket instead of
# letting them spawn or probe private paths.
autospawn = no
default-server = unix:/run/user/1001/pulse/native

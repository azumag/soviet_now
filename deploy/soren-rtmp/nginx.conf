load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

worker_processes 1;
pid /run/soren-rtmp-relay/nginx.pid;
error_log stderr notice;

events {
    worker_connections 128;
}

# Ubuntu's nginx binary has a compiled-in HTTP access-log path. Keep an empty
# HTTP context with logging disabled so the unprivileged relay never opens it.
# No HTTP server or listen socket is defined.
http {
    access_log off;
}

rtmp {
    # nginx-rtmp has its own access-log module and otherwise inherits the
    # distro's compiled /var/log/nginx/access.log path.
    access_log off;

    server {
        listen 127.0.0.1:1935;
        chunk_size 4096;
        ping 30s;
        ping_timeout 10s;

        application soren {
            live on;
            record off;
            # Upstream pushes reconnect automatically after a network or
            # platform-side disconnect. This is the module's documented
            # default, repeated explicitly so the recovery contract is visible.
            push_reconnect 3s;

            allow publish 127.0.0.1;
            deny publish all;
            allow play 127.0.0.1;
            deny play all;

            # Root-owned, relay-group-readable file. One `push ...;` directive
            # per destination enables multi-streaming without re-encoding.
            include /etc/soren-rtmp/push.conf;
        }
    }
}

name: Independent prediction rounds
on:
  pull_request:
    paths: ['show_status.sh', 'overlays/direct_broadcast_overlay.html', 'lib/direct_broadcast_overlay.mjs', 'tests/test_direct_broadcast_overlay.mjs', 'tests/test_ab_overlay_comparison.mjs', 'lib/prediction_round.py', 'workers/prediction_worker.sh', 'twitch_predictions.sh', 'eloop.sh', 'strategy/improve.sh', 'tests/test_prediction_round.py', 'tests/test_prediction_commentary.sh', 'twitch_chat.sh', 'twitch_chat_daemon.sh', 'tests/test_twitch_self_posts.sh', '.github/workflows/prediction-round.yml']
  push:
    branches: [main]
    paths: ['show_status.sh', 'overlays/direct_broadcast_overlay.html', 'lib/direct_broadcast_overlay.mjs', 'tests/test_direct_broadcast_overlay.mjs', 'tests/test_ab_overlay_comparison.mjs', 'lib/prediction_round.py', 'workers/prediction_worker.sh', 'twitch_predictions.sh', 'eloop.sh', 'strategy/improve.sh', 'tests/test_prediction_round.py', 'tests/test_prediction_commentary.sh', 'twitch_chat.sh', 'twitch_chat_daemon.sh', 'tests/test_twitch_self_posts.sh', '.github/workflows/prediction-round.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest tests.test_prediction_round
      - run: bash tests/test_prediction_commentary.sh
      - run: bash tests/test_twitch_self_posts.sh
      - run: for f in eloop.sh strategy/improve.sh workers/prediction_worker.sh twitch_predictions.sh; do bash -n "$f"; done

      - run: node --test tests/test_direct_broadcast_overlay.mjs tests/test_ab_overlay_comparison.mjs

name: Comment quality workbench (branch only)
on:
  push:
    branches: [fix/comment-reply-quality-20260915]
    paths:
      - '.github/workflows/comment-quality-workbench.yml'
      - 'tools/_apply_comment_quality_20260915.py'
      - 'tools/_comment_quality_edits.*'
permissions:
  contents: read
jobs:
  apply-reviewed-patch:
    if: github.repository == 'azumag/soviet_now' && github.ref == 'refs/heads/fix/comment-reply-quality-20260915' && github.actor == 'azumag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/comment-reply-quality-20260915
          persist-credentials: true
      - name: Apply exact reviewed source (fail on drift)
        run: |
          python3 tools/_apply_comment_quality_20260915.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('broadcast/comment.sh')
          s = p.read_text()
          start = s.index('# All reply routes share this contract')
          end = s.index('# カテゴリ別の追加指示', start)
          block = s[start:end]
          s = s[:start] + s[end:]
          s = s.rstrip() + '\n\n' + block
          assert hashlib.sha256(s.encode()).hexdigest() == 'e129f6fc73a19a7b64c0f3a99834b724cc20a7767a6989c1e1ad347b2d0ff63b'
          p.write_text(s)
          p = Path('tests/test_comment_reply_quality.py')
          s = p.read_text().replace('for key in re.findall(', 'for variable in re.findall(').replace("self.env[key] = '(none)'", "self.env[variable] = '(none)'")
          assert hashlib.sha256(s.encode()).hexdigest() == '897b204f89d1cc56ef21400165aa068ceec9cc7b01547633658206816957a139'
          p.write_text(s)
          PY
          git add broadcast/comment.sh tests/test_comment_reply_quality.py
      - name: Install test-only template and status dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y gettext-base zsh
      - name: Offline regression tests
        run: |
          python3 -m unittest -v tests.test_comment_reply_quality tests.test_comment_template_envsubst tests.test_comment_viewer_memory tests.test_comment_bilingual
          python3 -m unittest tests.test_raid_research tests.test_country_stage_names
          bash -n broadcast/comment.sh broadcast/radio_engine.sh
          for test in tests/test_comment_body_dedup.sh tests/test_comment_celebration_history.sh tests/test_comment_duplicate_guard.sh tests/test_comment_ops_context.sh tests/test_comment_persona_mode.sh tests/test_comment_question_restraint.sh tests/test_comment_sing_json.sh tests/test_comment_soren91_game_state.sh tests/test_comment_think_leak_guard.sh tests/test_comment_viewer_memory_playback_gate.sh tests/test_comment_viewer_memory_prompt.sh; do
            bash "$test"
          done
      - name: Commit only the reviewed files to the task branch
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(comment): prioritize intent, grounded context and proportional replies'
          git push origin HEAD:refs/heads/fix/comment-reply-quality-20260915
      - name: Source checksum evidence
        if: always()
        run: git diff --stat HEAD

name: Credential HTTP security

on:
  pull_request:
    paths:
      - 'lib/curl_secure.sh'
      - 'twitch_polls.sh'
      - 'youtube_chat.sh'
      - 'tests/test_credential_http_argv.sh'
      - 'tests/test_twitch_polls.sh'
      - '.github/workflows/credential-http-security.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/curl_secure.sh'
      - 'twitch_polls.sh'
      - 'youtube_chat.sh'
      - 'tests/test_credential_http_argv.sh'
      - 'tests/test_twitch_polls.sh'
      - '.github/workflows/credential-http-security.yml'

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Credential argv and process-environment regression
        run: bash tests/test_credential_http_argv.sh
      - name: Twitch polls regression
        run: bash tests/test_twitch_polls.sh

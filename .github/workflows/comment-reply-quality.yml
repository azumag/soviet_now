name: Comment reply quality
on:
  pull_request:
    paths:
      - 'broadcast/comment.sh'
      - 'broadcast/comment_lib.sh'
      - 'broadcast/comment_quality.sh'
      - 'broadcast/comment_runtime_policy.sh'
      - 'broadcast/radio_engine.sh'
      - 'core/helpers.sh'
      - 'eloop_lib.sh'
      - 'prompts/comment*.md'
      - 'prompts/speech_vocabulary_rule.md'
      - 'lib/comment_*.py'
      - 'lib/runtime_audio_fence.py'
      - 'lib/weather_audio_consumer.py'
      - 'lib/radio_game_context.py'
      - 'tests/test_radio_game_context.py'
      - 'tests/test_weather_audio_consumer.py'
      - 'docs/weather-audio-consumer.md'
      - 'lib/outbound_queue.sh'
      - 'tests/test_outbound_queue_youtube_split.py'
      - 'tests/test_outbound_delivery*'
      - 'say_enqueue.sh'
      - 'tests/test_runtime_audio_fence.py'
      - 'tests/test_comment*'
      - 'tests/test_bug_dispatch*'
      - 'tests/fixtures/comment_pipeline/**'
      - 'tests/test_crypto_paper_playback_dedup_exempt.sh'
      - 'tests/test_say_speaking_state.sh'
      - 'twitch_chat.sh'
      - 'youtube_chat.sh'
      - 'kick_chat.sh'
      - 'tests/test_*comment_identity.py'
      - '.github/workflows/comment-reply-quality.yml'
  push:
    branches: [main]
    paths:
      - 'broadcast/comment.sh'
      - 'broadcast/comment_lib.sh'
      - 'broadcast/comment_quality.sh'
      - 'broadcast/comment_runtime_policy.sh'
      - 'broadcast/radio_engine.sh'
      - 'core/helpers.sh'
      - 'eloop_lib.sh'
      - 'prompts/comment*.md'
      - 'prompts/speech_vocabulary_rule.md'
      - 'lib/comment_*.py'
      - 'lib/runtime_audio_fence.py'
      - 'lib/weather_audio_consumer.py'
      - 'lib/radio_game_context.py'
      - 'tests/test_radio_game_context.py'
      - 'tests/test_weather_audio_consumer.py'
      - 'docs/weather-audio-consumer.md'
      - 'lib/outbound_queue.sh'
      - 'tests/test_outbound_queue_youtube_split.py'
      - 'tests/test_outbound_delivery*'
      - 'say_enqueue.sh'
      - 'tests/test_runtime_audio_fence.py'
      - 'tests/test_comment*'
      - 'tests/test_bug_dispatch*'
      - 'tests/fixtures/comment_pipeline/**'
      - 'tests/test_crypto_paper_playback_dedup_exempt.sh'
      - 'tests/test_say_speaking_state.sh'
      - 'twitch_chat.sh'
      - 'youtube_chat.sh'
      - 'kick_chat.sh'
      - 'tests/test_*comment_identity.py'
      - '.github/workflows/comment-reply-quality.yml'
permissions:
  contents: read
env:
  AI_PRIORITY_NOW_EPOCH: '1790254800'
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test dependencies
        # envsubst はテンプレートのテストに必須。zsh はこの workflow のテストでは使わない（zsh を PATH から
        # 外してもテストが通ることを確認済み）ので、入らなくても警告で続行する。
        # ランナーの apt ミラーの名前解決障害で、入れるだけのステップが 5 分待って落ちるのを避ける。
        run: |
          need=""
          command -v envsubst >/dev/null || need="$need gettext-base"
          command -v zsh >/dev/null || need="$need zsh"
          if [ -n "$need" ]; then
            sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
              || echo "::warning::apt-get update failed"
            sudo env DEBIAN_FRONTEND=noninteractive timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              install -y --no-install-recommends $need || echo "::warning::could not install:$need"
          fi
          command -v envsubst >/dev/null || { echo "::error::envsubst is required by the template tests"; exit 1; }
      - name: Intent, rendering, output validation, history and translation
        run: python3 -m unittest -v tests.test_comment_reply_quality tests.test_comment_template_envsubst tests.test_comment_viewer_memory tests.test_comment_bilingual tests.test_comment_classifier_docich tests.test_twitch_comment_identity tests.test_youtube_comment_identity tests.test_comment_self_context
      - name: Outbound YouTube UTF-8 split and failure contracts
        run: python3 -m unittest discover -s tests -p test_outbound_queue_youtube_split.py -v
      - name: Hanjuku runtime-bound narration
        run: python3 -m unittest -v tests.test_runtime_audio_fence tests.test_radio_game_context
      - name: Weather-corner shared audio consumer
        env:
          WEATHER_TEST_REQUIRE_PROCESS_GROUP_STOP: "1"
        run: python3 -m unittest -v tests.test_weather_audio_consumer
      - name: Raid and country-name regression tests
        run: python3 -m unittest tests.test_raid_research tests.test_country_stage_names
      - name: Shell syntax and comment delivery contracts
        run: |
          bash -n broadcast/comment.sh broadcast/comment_lib.sh broadcast/comment_quality.sh broadcast/comment_runtime_policy.sh broadcast/radio_engine.sh lib/outbound_queue.sh say_enqueue.sh
          for test in tests/test_bug_dispatch_characterization.sh tests/test_comment_advice_routing.sh tests/test_comment_body_dedup.sh tests/test_comment_celebration_history.sh tests/test_comment_duplicate_guard.sh tests/test_comment_intake_dedup_characterization.sh tests/test_comment_ops_context.sh tests/test_comment_persona_mode.sh tests/test_comment_punctuation_quality.sh tests/test_comment_question_restraint.sh tests/test_comment_runtime_policy.sh tests/test_comment_self_context_prompt.sh tests/test_comment_sing_json.sh tests/test_comment_soren91_game_state.sh tests/test_comment_special_corner_memo.sh tests/test_comment_think_leak_guard.sh tests/test_comment_translation_log.sh tests/test_comment_viewer_memory_playback_gate.sh tests/test_comment_viewer_memory_prompt.sh tests/test_comment_audio_announce_characterization.sh tests/test_comment_junction_markers.sh tests/test_crypto_paper_playback_dedup_exempt.sh tests/test_outbound_delivery_characterization.sh tests/test_say_speaking_state.sh; do
            bash "$test"
          done
      - name: Comment pipeline schema/corpus contract (soviet_now#144)
        run: python3 -m unittest -v tests.test_comment_pipeline_schemas

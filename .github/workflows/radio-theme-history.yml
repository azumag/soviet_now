name: Radio theme history

on:
  pull_request:
    paths:
      - 'lib/radio_theme_history.py'
      - 'broadcast/radio_themes.sh'
      - 'broadcast/radio_persona.sh'
      - 'broadcast/radio_corners.sh'
      - 'broadcast/radio_state.sh'
      - 'broadcast/scheduler.sh'
      - 'core/config.sh'
      - 'data/radio_themes.txt'
      - 'prompts/radio_theme.md'
      - 'tests/test_radio_theme_history.py'
      - 'tests/test_radio_manual_trigger_idle.sh'
      - 'tests/test_radio_time_sync.sh'
      - '.github/workflows/radio-theme-history.yml'
  push:
    branches: [main]
    paths:
      - 'lib/radio_theme_history.py'
      - 'broadcast/radio_themes.sh'
      - 'broadcast/radio_persona.sh'
      - 'broadcast/radio_corners.sh'
      - 'broadcast/radio_state.sh'
      - 'broadcast/scheduler.sh'
      - 'core/config.sh'
      - 'data/radio_themes.txt'
      - 'prompts/radio_theme.md'
      - 'tests/test_radio_theme_history.py'
      - 'tests/test_radio_manual_trigger_idle.sh'
      - 'tests/test_radio_time_sync.sh'
      - '.github/workflows/radio-theme-history.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest tests.test_radio_theme_history
      - run: bash tests/test_radio_manual_trigger_idle.sh
      - run: bash tests/test_radio_time_sync.sh
      - run: python3 -m py_compile lib/radio_theme_history.py tests/test_radio_theme_history.py
      - run: bash -n broadcast/radio_themes.sh broadcast/radio_persona.sh broadcast/radio_corners.sh broadcast/radio_state.sh broadcast/scheduler.sh core/config.sh

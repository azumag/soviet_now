name: Soren91 commentary contracts

on:
  pull_request:
    paths:
      - '.github/workflows/soren91-comment-contracts.yml'
      - 'soren91/comment.mjs'
      - 'soren91/prompts/**'
      - 'soren91/text_ai.mjs'
      - 'tests/test_soren91_comment_variation.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/soren91-comment-contracts.yml'
      - 'soren91/comment.mjs'
      - 'soren91/prompts/**'
      - 'soren91/text_ai.mjs'
      - 'tests/test_soren91_comment_variation.mjs'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - name: Install Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check commentary modules
        run: |
          node --check soren91/comment.mjs
          node --check soren91/text_ai.mjs
      - name: Run commentary variation regression
        run: node --test tests/test_soren91_comment_variation.mjs

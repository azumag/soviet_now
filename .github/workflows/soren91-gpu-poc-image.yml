name: Soren91 GPU PoC image

on:
  push:
    branches:
      - codex/issue-23-vast-poc
    paths:
      - .github/workflows/soren91-gpu-poc-image.yml
      - infra/vast/soren91/**
      - tools/soren91_gpu_runner.mjs
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: soren91-gpu-poc-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/vast/soren91/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/soren91-gpu-runner:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/soren91-gpu-runner:poc

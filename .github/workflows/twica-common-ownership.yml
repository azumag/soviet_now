name: TwiCa common ownership
on:
  pull_request:
    paths:
      - '.github/workflows/twica-common-ownership.yml'
      - 'lib/twica_ownership.mjs'
      - 'lib/direct_overlay.mjs'
      - 'lib/twica_overlay_proxy.mjs'
      - 'direct_stream.sh'
      - 'tests/test_twica_ownership.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/twica-common-ownership.yml'
      - 'lib/twica_ownership.mjs'
      - 'lib/direct_overlay.mjs'
      - 'lib/twica_overlay_proxy.mjs'
      - 'direct_stream.sh'
      - 'tests/test_twica_ownership.mjs'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          bash -n direct_stream.sh
          node --check lib/twica_ownership.mjs
          node --test tests/test_twica_ownership.mjs tests/test_direct_overlay.mjs tests/test_twica_overlay_layout.mjs tests/test_twica_overlay_proxy.mjs tests/test_shared_overlay.mjs

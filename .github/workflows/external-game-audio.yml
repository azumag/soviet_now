name: External game audio contracts

on:
  pull_request:
    paths:
      - 'external_game_audio.mjs'
      - 'tests/test_external_game_audio.mjs'
      - '.github/workflows/external-game-audio.yml'
  push:
    branches: [main]
    paths:
      - 'external_game_audio.mjs'
      - 'tests/test_external_game_audio.mjs'
      - '.github/workflows/external-game-audio.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node --check external_game_audio.mjs
      - run: node --test tests/test_external_game_audio.mjs

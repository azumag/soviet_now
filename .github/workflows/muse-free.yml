name: Muse free recovery
on:
  pull_request:
    paths:
      - 'lib/ai_generate.sh'
      - 'lib/ai_generate_policy.sh'
      - 'eloop_lib.sh'
      - 'lib/opencode_rate_limit_guard.py'
      - 'probe_free_slot.sh'
      - 'broadcast/radio_corners.sh'
      - 'workers/radio_worker.sh'
      - 'tests/test_radio_worker_runtime_refresh.sh'
      - 'tests/test_ai_dispatch_diagnostics.sh'
      - 'tests/test_ai_prepass_backoff_scope.sh'
      - 'tests/test_opencode_rate_limit_guard.py'
      - 'lib/ai_backoff_status.py'
      - 'status_dashboard.py'
      - 'tests/test_ai_generate_backoff.py'
      - '.github/workflows/muse-free.yml'
  push:
    branches: [main]
    paths:
      - 'lib/ai_generate.sh'
      - 'lib/ai_generate_policy.sh'
      - 'eloop_lib.sh'
      - 'lib/opencode_rate_limit_guard.py'
      - 'probe_free_slot.sh'
      - 'broadcast/radio_corners.sh'
      - 'workers/radio_worker.sh'
      - 'tests/test_radio_worker_runtime_refresh.sh'
      - 'tests/test_ai_dispatch_diagnostics.sh'
      - 'tests/test_ai_prepass_backoff_scope.sh'
      - 'tests/test_opencode_rate_limit_guard.py'
      - 'lib/ai_backoff_status.py'
      - 'status_dashboard.py'
      - 'tests/test_ai_generate_backoff.py'
      - '.github/workflows/muse-free.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest tests.test_opencode_rate_limit_guard tests.test_ai_generate_backoff
      - run: bash tests/test_vercel_opencode_backend.sh
      - run: bash tests/test_ai_dispatch_diagnostics.sh
      - run: bash tests/test_ai_prepass_backoff_scope.sh
      - run: bash tests/test_radio_worker_runtime_refresh.sh
      - run: bash -n lib/ai_generate.sh lib/ai_generate_policy.sh eloop_lib.sh probe_free_slot.sh broadcast/radio_corners.sh workers/radio_worker.sh tests/test_radio_worker_runtime_refresh.sh

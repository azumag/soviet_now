name: Overlay notify category gate
on:
  pull_request:
    paths: ['overlay_notify.sh', 'tests/test_overlay_notify_category.sh', '.github/workflows/overlay-notify-category.yml']
  push:
    branches: [main]
    paths: ['overlay_notify.sh', 'tests/test_overlay_notify_category.sh', '.github/workflows/overlay-notify-category.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: bash tests/test_overlay_notify_category.sh
      - run: bash -n overlay_notify.sh

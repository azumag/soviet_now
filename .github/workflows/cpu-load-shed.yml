name: CPU load shed

on:
  pull_request:
    paths:
      - 'broadcast/scheduler.sh'
      - 'tests/test_radio_cpu_load_shed.sh'
      - 'tests/test_peak_hour_queue_gate.sh'
      - 'tests/test_radio_backpressure.sh'
      - '.github/workflows/cpu-load-shed.yml'
  push:
    branches: [main]
    paths:
      - 'broadcast/scheduler.sh'
      - 'tests/test_radio_cpu_load_shed.sh'
      - 'tests/test_peak_hour_queue_gate.sh'
      - 'tests/test_radio_backpressure.sh'
      - '.github/workflows/cpu-load-shed.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: bash tests/test_radio_cpu_load_shed.sh
      - run: bash tests/test_peak_hour_queue_gate.sh
      - run: bash tests/test_radio_backpressure.sh
      - run: bash -n broadcast/scheduler.sh

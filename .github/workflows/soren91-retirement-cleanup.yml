name: Soren91 retirement cleanup

on:
  push:
    branches:
      - remove-soren91-improvement-remnants-physical

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: remove-soren91-improvement-remnants-physical
          persist-credentials: true
      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_remove_soren91_cleanup_driver.py
          python3 .github/scripts/remove_soren91_improvement_remnants.py
      - name: Syntax and Soren91 regression checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n soren91_control.sh soren91/run_player_loop.sh soren_loop.sh strategy/improve.sh core/config.sh core/streaming_shim.sh broadcast/comment_lib.sh show_status.sh monitor_improve_runtime.sh
          node --check soren91/main.mjs
          python3 -m py_compile status_dashboard.py
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/test_soren91_*.mjs
          python3 -m unittest tests.test_soren91_runtime_metrics
      - name: Assert retired machinery is physically absent
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'soren91_improve|SOREN91_IMPROVE|SOREN91_EXTERNAL_IMPROVE|IMPROVEMENT_INTERVAL_GAMES|SOREN91_MERIKEN_IMPROVE_INTERVAL|POST_IMPROVE_SOREN91_SESSION_IMPROVE_ENABLED|SOREN91_SESSION_FILE|session_games\.json' -- ':!failures.txt' ':!.github/workflows/soren91-retirement-cleanup.yml' ':!.github/scripts/remove_soren91_improvement_remnants.py' ':!.github/scripts/fix_remove_soren91_cleanup_driver.py'; then
            echo 'retired Soren91 improvement remnants remain' >&2
            exit 1
          fi
          test ! -e soren91/improve.mjs
      - name: Commit reviewed cleanup to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tsubasa Azumagakito'
          git config user.email 'azumag@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(soren91): remove retired improvement remnants'
          git push origin HEAD:remove-soren91-improvement-remnants-physical

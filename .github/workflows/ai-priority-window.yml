name: AI priority window contracts
on:
  pull_request:
    paths: ['config/ai_priority_window.json', 'lib/ai_priority_window.*', 'lib/ai_generate*.sh', 'strategy/ai.sh', 'broadcast/**', 'soren91/text_ai.mjs', 'tests/test_ai_priority_window.*', '.github/workflows/ai-priority-window.yml']
  push:
    branches: [main]
    paths: ['config/ai_priority_window.json', 'lib/ai_priority_window.*', 'lib/ai_generate*.sh', 'strategy/ai.sh', 'broadcast/**', 'soren91/text_ai.mjs', 'tests/test_ai_priority_window.*', '.github/workflows/ai-priority-window.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash tests/test_ai_priority_window.sh
      - run: node --test tests/test_ai_priority_window.mjs

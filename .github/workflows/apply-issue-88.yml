name: Apply issue 88 source patch

on:
  push:
    branches: ['fix/88-outbound-priority-order']
    paths:
      - '.github/workflows/apply-issue-88.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/88-outbound-priority-order
          fetch-depth: 0
      - name: Apply the focused queue selection change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/outbound_queue.sh')
          text = path.read_text(encoding='utf-8')
          old = 'msg_file=$(ls -1t "$OUTBOUND_CHAT_PENDING_DIR"/*.msg 2>/dev/null | tail -1)'
          new = 'msg_file=$(python3 "$(dirname "${BASH_SOURCE[0]}")/outbound_queue_order.py" "$OUTBOUND_CHAT_PENDING_DIR" 2>/dev/null || true)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one FIFO selector, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run regression tests
        run: python3 -m unittest tests.test_outbound_queue_priority
      - name: Check shell syntax
        run: bash -n lib/outbound_queue.sh
      - name: Remove temporary patch workflow and commit
        run: |
          rm .github/workflows/apply-issue-88.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: consume outbound chat by priority'
          git push origin HEAD:fix/88-outbound-priority-order

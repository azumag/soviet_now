name: Jev comment classifier contracts
on:
  pull_request:
    paths:
      - 'eloop_lib.sh'
      - 'broadcast/comment.sh'
      - 'broadcast/comment_classifier_jev.sh'
      - 'lib/comment_bilingual.py'
      - 'lib/comment_classifier_jev*.py'
      - 'tests/test_comment_classifier_jev.py'
      - 'tests/fixtures/comment_classifier_jev_eval.jsonl'
      - '.github/workflows/comment-classifier-jev.yml'
  push:
    branches: [main]
    paths:
      - 'eloop_lib.sh'
      - 'broadcast/comment.sh'
      - 'broadcast/comment_classifier_jev.sh'
      - 'lib/comment_bilingual.py'
      - 'lib/comment_classifier_jev*.py'
      - 'tests/test_comment_classifier_jev.py'
      - 'tests/fixtures/comment_classifier_jev_eval.jsonl'
      - '.github/workflows/comment-classifier-jev.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      TYPESAFE_API_KEY: ''
      AI_PRIORITY_NOW_EPOCH: '1790254800'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_comment_classifier_jev.py' -v
      - run: bash -n broadcast/comment_classifier_jev.sh eloop_lib.sh

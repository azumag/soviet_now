name: Game lifecycle pause race
on:
  pull_request:
    paths: ['lib/game_lifecycle.sh', 'strategy/improve.sh', 'infra/cleanup.sh', 'tests/test_game_lifecycle_pause_race.sh', '.github/workflows/game-lifecycle-pause.yml']
  push:
    branches: [main]
    paths: ['lib/game_lifecycle.sh', 'strategy/improve.sh', 'infra/cleanup.sh', 'tests/test_game_lifecycle_pause_race.sh', '.github/workflows/game-lifecycle-pause.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: bash tests/test_game_lifecycle_pause_race.sh
      - run: bash -n lib/game_lifecycle.sh

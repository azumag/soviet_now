name: PR370 critical-turn archive fix

on:
  push:
    branches:
      - soren91/daily-evidence-critical-turns-20260916
    paths:
      - .github/workflows/pr370-critical-archive-fix.yml

permissions:
  contents: write

jobs:
  apply-reviewed-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - name: Keep game-over archive synchronous
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('soren91/main.mjs')
          text = path.read_text()

          import_anchor = "} from './lineage.mjs';\n"
          static_import = "import { archiveCriticalTurnScreenshots } from './critical_turn_screenshots.mjs';\n"
          if static_import not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('lineage import anchor is not unique')
              text = text.replace(import_anchor, import_anchor + static_import, 1)

          start_marker = '  // ゲーム別スクリーンショットをアーカイブ (最大3枚)。\n'
          end_marker = '  // 古いゲームスクリーンショット削除 (最新24ゲーム分のみ保持)\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('archive block markers are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          raw_block = """// ゲーム別スクリーンショットをアーカイブ (最大3枚)。
          // PR #370 の criticalTurns を実画像に反映し、履歴が欠損/不正な場合だけ
          // 従来の序盤/中盤/終盤サンプルへ安全にフォールバックする。
          // 同期処理 — 次ラウンドのスクリーンショット上書き前に完了する。
          const gameScreenshotDir = join('tmp/game_screenshots', `game_${String(gameNumber).padStart(4, '0')}`);
          try {
            const archived = archiveCriticalTurnScreenshots({
              screenshotDir: SCREENSHOT_DIR,
              outputDir: gameScreenshotDir,
              historyFile,
              maxShots: 3,
            });
            if (archived.archived > 0) {
              console.log(`[game] Archived ${archived.archived} screenshots to ${gameScreenshotDir} (history=${archived.historyStatus}, criticalTurns=${archived.preferredTurns.join(',') || 'none'})`);
            }
          } catch (e) {
            console.log(`[game] Screenshot archive failed: ${e.message}`);
          }

          """
          replacement = textwrap.indent(textwrap.dedent(raw_block), '  ')
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Regression tests
        run: |
          node --check soren91/main.mjs
          node --check soren91/critical_turn_screenshots.mjs
          node --test tests/test_soren91_daily_evidence.mjs tests/test_soren91_critical_turn_screenshots.mjs
      - name: Commit reviewed fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr370-critical-archive-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soren91/main.mjs .github/workflows/pr370-critical-archive-fix.yml
          git commit -m "fix(soren91): keep critical evidence archive synchronous"
          git push origin HEAD:soren91/daily-evidence-critical-turns-20260916

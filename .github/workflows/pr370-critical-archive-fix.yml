name: PR370 critical-turn archive fix

on:
  push:
    branches:
      - soren91/daily-evidence-critical-turns-20260916
    paths:
      - .github/workflows/pr370-critical-archive-fix.yml

permissions:
  contents: write

jobs:
  apply-reviewed-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply bounded archive integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('soren91/main.mjs')
          text = path.read_text()
          old = """  // ゲーム別スクリーンショットをアーカイブ (3枚: 序盤/中盤/終盤)
          // 同期処理 — 次ラウンドのスクリーンショット上書き前に完了する
          const gameScreenshotDir = join('tmp/game_screenshots', `game_${String(gameNumber).padStart(4, '0')}`);
          try {
            mkdirSync(gameScreenshotDir, { recursive: true });
            const ssFiles = readdirSync(SCREENSHOT_DIR)
              .filter(f => f.startsWith('turn_') && f.endsWith('.png')).sort();
            if (ssFiles.length > 0) {
              const earlyIdx = Math.min(2, ssFiles.length - 1);
              const midIdx = Math.floor(ssFiles.length / 2);
              const lateIdx = ssFiles.length - 1;
              for (const idx of [...new Set([earlyIdx, midIdx, lateIdx])]) {
                copyFileSync(
                  join(SCREENSHOT_DIR, ssFiles[idx]),
                  join(gameScreenshotDir, ssFiles[idx])
                );
              }
              console.log(`[game] Archived ${[...new Set([earlyIdx, midIdx, lateIdx])].length} screenshots to ${gameScreenshotDir}`);
            }
          } catch (e) {
            console.log(`[game] Screenshot archive failed: ${e.message}`);
          }
          """
          new = """  // ゲーム別スクリーンショットをアーカイブ (最大3枚)。
          // PR #370 の criticalTurns を実画像に反映し、履歴が欠損/不正な場合だけ
          // 従来の序盤/中盤/終盤サンプルへ安全にフォールバックする。
          // 同期処理 — 次ラウンドのスクリーンショット上書き前に完了する。
          const gameScreenshotDir = join('tmp/game_screenshots', `game_${String(gameNumber).padStart(4, '0')}`);
          try {
            const { archiveCriticalTurnScreenshots } = await import(
              new URL('./critical_turn_screenshots.mjs', import.meta.url).href
            );
            const archived = archiveCriticalTurnScreenshots({
              screenshotDir: SCREENSHOT_DIR,
              outputDir: gameScreenshotDir,
              historyFile,
              maxShots: 3,
            });
            if (archived.archived > 0) {
              console.log(`[game] Archived ${archived.archived} screenshots to ${gameScreenshotDir} (history=${archived.historyStatus}, criticalTurns=${archived.preferredTurns.join(',') || 'none'})`);
            }
          } catch (e) {
            console.log(`[game] Screenshot archive failed: ${e.message}`);
          }
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one archive block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Regression tests
        run: |
          node --check soren91/main.mjs
          node --test tests/test_soren91_daily_evidence.mjs tests/test_soren91_critical_turn_screenshots.mjs
      - name: Commit reviewed fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr370-critical-archive-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soren91/main.mjs soren91/critical_turn_screenshots.mjs tests/test_soren91_critical_turn_screenshots.mjs .github/workflows/pr370-critical-archive-fix.yml
          git commit -m "fix(soren91): archive critical-turn evidence frames"
          git push origin HEAD:soren91/daily-evidence-critical-turns-20260916

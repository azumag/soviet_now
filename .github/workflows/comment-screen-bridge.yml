name: Comment screen bridge
on:
  pull_request:
    paths:
      - 'broadcast/comment_screen_context.sh'
      - 'eloop_lib.sh'
      - 'tests/test_comment_screen_bridge.py'
      - '.github/workflows/comment-screen-bridge.yml'
permissions:
  contents: read
jobs:
  screen-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: bash -n eloop_lib.sh broadcast/comment_screen_context.sh
      - run: python3 tests/test_comment_screen_bridge.py

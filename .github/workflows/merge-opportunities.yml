      - 'tests/fixtures/vertical_lane_direct_*.json'
      - '.github/workflows/merge-opportunities.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: bash tests/test_eloop_runner_tail_cleanup.sh
      - name: ab migration gate lint + unit test
        run: |
          bash -n strategy/ab_gate_on_merge.sh
          bash tests/test_ab_gate_on_merge.sh
      - run: >-
          python3 -m unittest
          tests.test_soviet_continuation
          tests.test_twitch_clip_delivery tests.test_settle_wait
          tests.test_merge_opportunity_preservation tests.test_merge_opportunity_trace tests.test_buried_exposed_merge_candidate tests.test_merge_burial_baseline tests.test_strategy_hash
          tests.test_policy_bundle tests.test_v747_endgame_merge
          tests.test_runner_direct_cross_hook tests.test_post_first_russia_pair_tether
          tests.test_post_first_russia_lane_cover tests.test_vertical_lane_direct
          tests.test_post_russia_contact
          tests.test_low_drop_high_lane_cover
          tests.test_strategy_semantic_lint tests.test_v763_weight_constant
          tests.test_reason_tags tests.test_reason_tags_shadow tests.test_reason_tags_runner
          tests.test_anchor_lane_seed_contact tests.test_decide_missing_defaults
          tests.test_first_russia_t11_lane_guard tests.test_merge_top_model
          tests.test_post_russia_chain_cover tests.test_pre_russia_chain_cover
          tests.test_pre_russia_ukraine_pair_lane tests.test_probable_merge_contact
          tests.test_reactive_pair_helper tests.test_reactive_pair_strategy_contract
          tests.test_same_type_seed_contact tests.test_strategy_accumulate_shadow
          tests.test_strategy_run_journal tests.test_strategy_runner_child_reaping
          tests.test_surface_flatness_axis tests.test_v744_exposure
          tests.test_v748_seat_lanes tests.test_v759_cover_tier
          tests.test_v760_ceiling tests.test_v762_roughness
          tests.test_v763_diversity tests.test_v764_nextnext_lane
          tests.test_visible_same_country_contact

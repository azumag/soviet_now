name: Improve heartbeat lifecycle
on:
  pull_request:
    paths: ['improve_daemon.sh', 'tests/test_improve_heartbeat.py', '.github/workflows/improve-heartbeat.yml']
  push:
    branches: [main]
    paths: ['improve_daemon.sh', 'tests/test_improve_heartbeat.py', '.github/workflows/improve-heartbeat.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest tests.test_improve_heartbeat
      - run: bash -n improve_daemon.sh

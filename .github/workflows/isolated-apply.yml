name: Isolated apply gate
on:
  pull_request:
    paths: ['strategy/sandbox.sh', '.github/workflows/isolated-apply.yml']
  push:
    branches: [main]
    paths: ['strategy/sandbox.sh', '.github/workflows/isolated-apply.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest tests.test_strategy_sandbox_no_host_exec tests.test_isolated_runner_rootless
      - run: bash -n strategy/sandbox.sh

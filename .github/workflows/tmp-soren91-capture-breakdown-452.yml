name: temporary Soren91 capture breakdown patch
on:
  push:
    branches:
      - automation/soren91-capture-breakdown-452
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: stage capture breakdown patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/soren91-capture-breakdown-452
          fetch-depth: 0
      - name: Apply deterministic telemetry patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          realtime = Path('soren91/realtime_io.mjs')
          text = realtime.read_text()
          old = """        const before = await geometry(session, check);
        const capturedAt = now(); // Conservative age: request start, NOT transfer completion.
        // Page-level clipping skips locator actionability/scroll/stability waits.
        // Use Playwright's own screenshot session: raw capture on a NEW CDP
        // session can reset DPR emulation belonging to the host's session.
        const buffer = await page.screenshot({
          type: 'png', scale: 'css', timeout: remaining(),
          clip: { x: before.x, y: before.y, width: before.width, height: before.height },
        });
        check();
        if (!Buffer.isBuffer(buffer) || buffer.length > 24 * 1024 * 1024) throw new Error('capture-invalid-image');
        const size = pngSize(buffer);
        // Attached browsers may not expose their native DPR in context options.
        // CSS-pixel and native-DPR PNGs are both valid;
        // input maps from actual PNG dimensions instead of guessing from DPR.
        const matchesScale = scale => Math.abs(size.width - before.width * scale) <= 1
          && Math.abs(size.height - before.height * scale) <= 1;
        if ((!matchesScale(1) && !matchesScale(before.dpr)) || size.width * size.height > 16_777_216) {
          throw new Error('capture-pixel-scale-mismatch');
        }
        const after = await geometry(session, check);
        if (!sameGeometry(before, after)) throw new Error('capture-geometry-changed');
        return { buffer, geometry: after, capturedAt, captureMs: now() - capturedAt, ...size };
"""
          new = """        const geometryBeforeStartedAt = now();
        const before = await geometry(session, check);
        const geometryBeforeEndedAt = now();
        const capturedAt = geometryBeforeEndedAt; // Preserve existing freshness semantics.
        // Page-level clipping skips locator actionability/scroll/stability waits.
        // Use Playwright's own screenshot session: raw capture on a NEW CDP
        // session can reset DPR emulation belonging to the host's session.
        const screenshotStartedAt = capturedAt;
        const buffer = await page.screenshot({
          type: 'png', scale: 'css', timeout: remaining(),
          clip: { x: before.x, y: before.y, width: before.width, height: before.height },
        });
        check();
        const screenshotEndedAt = now();
        const imageValidateStartedAt = screenshotEndedAt;
        if (!Buffer.isBuffer(buffer) || buffer.length > 24 * 1024 * 1024) throw new Error('capture-invalid-image');
        const size = pngSize(buffer);
        // Attached browsers may not expose their native DPR in context options.
        // CSS-pixel and native-DPR PNGs are both valid;
        // input maps from actual PNG dimensions instead of guessing from DPR.
        const matchesScale = scale => Math.abs(size.width - before.width * scale) <= 1
          && Math.abs(size.height - before.height * scale) <= 1;
        if ((!matchesScale(1) && !matchesScale(before.dpr)) || size.width * size.height > 16_777_216) {
          throw new Error('capture-pixel-scale-mismatch');
        }
        const imageValidateEndedAt = now();
        const geometryAfterStartedAt = imageValidateEndedAt;
        const after = await geometry(session, check);
        const geometryAfterEndedAt = now();
        if (!sameGeometry(before, after)) throw new Error('capture-geometry-changed');
        return {
          buffer, geometry: after, capturedAt, captureMs: now() - capturedAt, ...size,
          captureStageMs: {
            geometryBefore: Math.max(0, geometryBeforeEndedAt - geometryBeforeStartedAt),
            screenshot: Math.max(0, screenshotEndedAt - screenshotStartedAt),
            imageValidate: Math.max(0, imageValidateEndedAt - imageValidateStartedAt),
            geometryAfter: Math.max(0, geometryAfterEndedAt - geometryAfterStartedAt),
          },
        };
"""
          assert text.count(old) == 1, 'realtime capture block drifted'
          realtime.write_text(text.replace(old, new))

          metrics = Path('soren91/loop_metrics.mjs')
          text = metrics.read_text()
          old = "export const DROP_PROFILE_STAGES = [...STAGES, 'holdInput', 'overlap', 'unattributed'];\n"
          new = old + "export const CAPTURE_PROFILE_STAGES = ['geometryBefore', 'screenshot', 'imageValidate', 'geometryAfter'];\n"
          assert text.count(old) == 1, 'stage declaration drifted'
          text = text.replace(old, new)

          old = """    try { return await action(); }
    finally {
"""
          new = """    try {
      const result = await action();
      if (stage === 'capture') this._captureStages(result?.captureStageMs);
      return result;
    }
    finally {
"""
          assert text.count(old) == 1, 'measure block drifted'
          text = text.replace(old, new)

          marker = """  observe(state) {
"""
          insert = """  _captureStages(value) {
    const bucket = this.profileOpen;
    if (!bucket || !value || typeof value !== 'object') return;
    const parsed = {};
    for (const key of CAPTURE_PROFILE_STAGES) {
      const n = value[key];
      if (typeof n !== 'number' || !Number.isFinite(n) || n < 0) return;
      parsed[key] = n;
    }
    for (const key of CAPTURE_PROFILE_STAGES) bucket.captureStageMs[key] += parsed[key];
  }
""" + marker
          assert text.count(marker) == 1, 'observe marker drifted'
          text = text.replace(marker, insert)

          old = """      const stageMs = Object.fromEntries(DROP_PROFILE_STAGES.map(s => [s, rounded(bucket.stageMs[s])]));
      const durationMs = rounded(Math.max(0, now - bucket.start));
"""
          new = """      const stageMs = Object.fromEntries(DROP_PROFILE_STAGES.map(s => [s, rounded(bucket.stageMs[s])]));
      const captureStageMs = Object.fromEntries(CAPTURE_PROFILE_STAGES.map(s => [s, rounded(bucket.captureStageMs[s])]));
      const durationMs = rounded(Math.max(0, now - bucket.start));
"""
          assert text.count(old) == 1, 'profile finalize block drifted'
          text = text.replace(old, new)

          old = """        endedAtMs: Date.now(), durationMs, stageMs, phaseCalls: { ...bucket.phaseCalls },
"""
          new = """        endedAtMs: Date.now(), durationMs, stageMs, captureStageMs, phaseCalls: { ...bucket.phaseCalls },
"""
          assert text.count(old) == 1, 'profile record block drifted'
          text = text.replace(old, new)

          old = """      stageMs: zeros(DROP_PROFILE_STAGES), phaseCalls: zeros([...STAGES, 'holdInput']),
"""
          new = """      stageMs: zeros(DROP_PROFILE_STAGES), captureStageMs: zeros(CAPTURE_PROFILE_STAGES),
      phaseCalls: zeros([...STAGES, 'holdInput']),
"""
          assert text.count(old) == 1, 'profile open block drifted'
          text = text.replace(old, new)

          old = """          stageMs: { ...record.stageMs }, phaseCalls: { ...record.phaseCalls },
"""
          new = """          stageMs: { ...record.stageMs }, captureStageMs: { ...record.captureStageMs },
          phaseCalls: { ...record.phaseCalls },
"""
          assert text.count(old) == 1, 'profile clone block drifted'
          metrics.write_text(text.replace(old, new))

          test = Path('tests/test_soren91_capture_breakdown.mjs')
          test.write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import { createCanvasIO } from '../soren91/realtime_io.mjs';
import { CAPTURE_PROFILE_STAGES, LoopMetrics } from '../soren91/loop_metrics.mjs';

const geometry = {
  canvasId: 1, documentId: 100, x: 10, y: 20, width: 800, height: 450,
  scrollX: 0, scrollY: 0, dpr: 1, viewportWidth: 1280, viewportHeight: 720, viewportScale: 1,
};

function png(width = 800, height = 450) {
  const buffer = Buffer.alloc(24);
  Buffer.from('89504e470d0a1a0a', 'hex').copy(buffer);
  buffer.write('IHDR', 12);
  buffer.writeUInt32BE(width, 16);
  buffer.writeUInt32BE(height, 20);
  return buffer;
}

test('canvas capture exposes fixed phase timings without changing capture freshness semantics', async () => {
  let clock = 0;
  const session = {
    async send(method) {
      assert.equal(method, 'Runtime.evaluate');
      clock += 7;
      return { result: { value: geometry } };
    },
    async detach() {},
  };
  const page = {
    context: () => ({ async newCDPSession() { return session; } }),
    async screenshot() { clock += 13; return png(); },
  };
  const frame = await createCanvasIO({ now: () => clock }).capture(page);
  assert.deepEqual(Object.keys(frame.captureStageMs), CAPTURE_PROFILE_STAGES);
  assert.deepEqual(frame.captureStageMs, {
    geometryBefore: 7, screenshot: 13, imageValidate: 0, geometryAfter: 7,
  });
  assert.equal(frame.capturedAt, 7);
  assert.equal(frame.captureMs, 20);
});

test('drop profile sums only complete fixed capture timing objects and never persists free text', async () => {
  let clock = 0;
  const metrics = new LoopMetrics({ now: () => clock });
  metrics.begin(1, 0);
  metrics.dropSent();
  metrics.begin(1, 1);
  await metrics.measure('capture', async () => {
    clock += 28;
    return { captureStageMs: { geometryBefore: 7, screenshot: 13, imageValidate: 1, geometryAfter: 7 } };
  });
  clock += 2;
  metrics.dropSent();
  let record = metrics.flush('drop-sent').dropProfile.records.at(-1);
  assert.deepEqual(record.captureStageMs, {
    geometryBefore: 7, screenshot: 13, imageValidate: 1, geometryAfter: 7,
  });

  metrics.begin(1, 2);
  await metrics.measure('capture', async () => {
    clock += 5;
    return { captureStageMs: { geometryBefore: 1, screenshot: 'secret-provider', imageValidate: 1, geometryAfter: 1 } };
  });
  metrics.dropSent();
  record = metrics.flush('drop-sent').dropProfile.records.at(-1);
  assert.deepEqual(record.captureStageMs, {
    geometryBefore: 0, screenshot: 0, imageValidate: 0, geometryAfter: 0,
  });
  assert.equal(JSON.stringify(record).includes('secret-provider'), false);
});
""")
          PY
          node --test tests/test_soren91_capture_breakdown.mjs tests/test_soren91_realtime_io.mjs tests/test_soren91_drop_profile.mjs
          git rm .github/workflows/tmp-soren91-capture-breakdown-452.yml
          git add soren91/realtime_io.mjs soren91/loop_metrics.mjs tests/test_soren91_capture_breakdown.mjs
          git config user.name 'docich automation'
          git config user.email 'docich@example.invalid'
          git commit -m 'feat(soren91): expose capture phase telemetry (#452)'
          git push origin HEAD:automation/soren91-capture-breakdown-452

name: Shared overlay contracts

on:
  pull_request:
    paths:
      - '.node-version'
      - 'package*.json'
      - '.github/workflows/shared-overlay-contracts.yml'
      - 'start_shared_overlay_service.sh'
      - 'shared_overlay.mjs'
      - 'lib/shared_overlay.mjs'
      - 'lib/direct_overlay.mjs'
      - 'lib/direct_broadcast_overlay.mjs'
      - 'lib/direct_stream.py'
      - 'overlays/direct_broadcast_overlay.html'
      - 'tests/test_direct_stream.py'
      - 'tests/test_direct_stream_guard_delegate.py'
      - 'tests/test_direct_stream_instance_lock_delegate.py'
      - 'tests/test_direct_stream_canonical_lock_delegate.py'
      - 'tests/test_direct_stream_encoder_command_delegate.py'
      - 'tests/test_direct_stream_supervision_policy_delegate.py'
      - 'tests/test_direct_stream_state_files_delegate.py'
      - 'tests/test_direct_stream_monitor_policy_delegate.py'
      - 'tests/test_direct_stream_config_delegate.py'
      - 'tests/test_direct_broadcast_overlay.mjs'
      - 'tests/test_overlay_monitor_animation_throttle.mjs'
      - 'tests/test_direct_broadcast_overlay_browser.mjs'
      - 'tests/test_soren_monitor_browser.mjs'
      - 'tests/test_hanjuku_gap_browser.mjs'
      - 'tests/test_hanjuku_gap_full_visibility.py'
      - 'tests/test_game_gap_webgl_browser.mjs'
      - 'lib/twica_overlay_proxy.mjs'
      - 'lib/twica_legacy_owner.mjs'
      - 'direct_stream.sh'
      - 'game_lifecycle_control.sh'
      - 'deploy/soren-shared-overlay/**'
      - 'tests/test_shared_overlay.mjs'
      - 'tests/test_shared_overlay_geometry_delegate.mjs'
      - 'tests/test_shared_overlay_context_delegate.mjs'
      - 'tests/test_direct_overlay.mjs'
      - 'tests/test_direct_overlay_stage_delegate.mjs'
      - 'tests/test_direct_overlay_installer_delegate.mjs'
      - 'tests/test_direct_overlay_visibility_delegate.mjs'
      - 'tests/test_direct_game_stage_dom_delegate.mjs'
      - 'tests/test_direct_overlay_surface_selection_delegate.mjs'
      - 'tests/test_twica_overlay_layout.mjs'
      - 'tests/test_twica_overlay_proxy.mjs'
      - 'tests/test_twica_legacy_owner.mjs'
      - 'tests/test_shared_overlay_service.sh'
      - 'tests/test_game_lifecycle.sh'
  push:
    branches: [main]
    paths:
      - '.node-version'
      - 'package*.json'
      - '.github/workflows/shared-overlay-contracts.yml'
      - 'start_shared_overlay_service.sh'
      - 'shared_overlay.mjs'
      - 'lib/shared_overlay.mjs'
      - 'lib/direct_overlay.mjs'
      - 'lib/direct_broadcast_overlay.mjs'
      - 'lib/direct_stream.py'
      - 'overlays/direct_broadcast_overlay.html'
      - 'tests/test_direct_stream.py'
      - 'tests/test_direct_stream_guard_delegate.py'
      - 'tests/test_direct_stream_instance_lock_delegate.py'
      - 'tests/test_direct_stream_canonical_lock_delegate.py'
      - 'tests/test_direct_stream_encoder_command_delegate.py'
      - 'tests/test_direct_stream_supervision_policy_delegate.py'
      - 'tests/test_direct_stream_state_files_delegate.py'
      - 'tests/test_direct_stream_monitor_policy_delegate.py'
      - 'tests/test_direct_stream_config_delegate.py'
      - 'tests/test_direct_broadcast_overlay.mjs'
      - 'tests/test_overlay_monitor_animation_throttle.mjs'
      - 'tests/test_direct_broadcast_overlay_browser.mjs'
      - 'tests/test_soren_monitor_browser.mjs'
      - 'tests/test_hanjuku_gap_browser.mjs'
      - 'tests/test_hanjuku_gap_full_visibility.py'
      - 'tests/test_game_gap_webgl_browser.mjs'
      - 'lib/twica_overlay_proxy.mjs'
      - 'lib/twica_legacy_owner.mjs'
      - 'direct_stream.sh'
      - 'game_lifecycle_control.sh'
      - 'deploy/soren-shared-overlay/**'
      - 'tests/test_shared_overlay.mjs'
      - 'tests/test_shared_overlay_geometry_delegate.mjs'
      - 'tests/test_shared_overlay_context_delegate.mjs'
      - 'tests/test_direct_overlay.mjs'
      - 'tests/test_direct_overlay_stage_delegate.mjs'
      - 'tests/test_direct_overlay_installer_delegate.mjs'
      - 'tests/test_direct_overlay_visibility_delegate.mjs'
      - 'tests/test_direct_game_stage_dom_delegate.mjs'
      - 'tests/test_direct_overlay_surface_selection_delegate.mjs'
      - 'tests/test_twica_overlay_layout.mjs'
      - 'tests/test_twica_overlay_proxy.mjs'
      - 'tests/test_twica_legacy_owner.mjs'
      - 'tests/test_shared_overlay_service.sh'
      - 'tests/test_game_lifecycle.sh'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Install Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check the shared overlay service surface
        run: |
          bash -n start_shared_overlay_service.sh
          bash -n game_lifecycle_control.sh
          bash -n direct_stream.sh
          bash -n tests/test_shared_overlay_service.sh
          node --check shared_overlay.mjs
          node --check lib/shared_overlay.mjs
          node --check lib/direct_overlay.mjs
          node --check lib/twica_legacy_owner.mjs
      - name: Run shared and TwiCa overlay regressions
        run: >-
          node --test
          tests/test_shared_overlay.mjs
          tests/test_shared_overlay_geometry_delegate.mjs
          tests/test_shared_overlay_context_delegate.mjs
          tests/test_direct_overlay.mjs
          tests/test_direct_overlay_stage_delegate.mjs
          tests/test_direct_overlay_installer_delegate.mjs
          tests/test_direct_overlay_visibility_delegate.mjs
          tests/test_direct_game_stage_dom_delegate.mjs
          tests/test_direct_overlay_surface_selection_delegate.mjs
          tests/test_direct_broadcast_overlay.mjs
          tests/test_overlay_monitor_animation_throttle.mjs
          tests/test_twica_overlay_layout.mjs
          tests/test_twica_overlay_proxy.mjs
          tests/test_twica_legacy_owner.mjs
      - name: Run direct stream and Hanjuku gap visibility regressions
        run: |
          python3 -m unittest tests.test_direct_stream
          python3 -m unittest tests.test_direct_stream_guard_delegate
          python3 -m unittest tests.test_direct_stream_instance_lock_delegate
          python3 -m unittest tests.test_direct_stream_canonical_lock_delegate
          python3 -m unittest tests.test_direct_stream_encoder_command_delegate
          python3 -m unittest tests.test_direct_stream_supervision_policy_delegate
          python3 -m unittest tests.test_direct_stream_state_files_delegate
          python3 -m unittest tests.test_direct_stream_monitor_policy_delegate
          python3 -m unittest tests.test_direct_stream_config_delegate
          python3 -m unittest discover -s tests -p test_hanjuku_gap_full_visibility.py
      - name: Run shared overlay service lifecycle regression
        run: bash tests/test_shared_overlay_service.sh
      - name: Install isolated Chromium for overlay geometry regression
        run: npx playwright install --with-deps chromium
      - name: Check approved design with synthetic states and cropped surfaces
        env:
          SOREN_OVERLAY_BROWSER_TESTS: '1'
          SOREN_OVERLAY_ARTIFACT_DIR: ${{ runner.temp }}/overlay-v2-screens
        run: node --test tests/test_direct_broadcast_overlay_browser.mjs tests/test_soren_monitor_browser.mjs tests/test_hanjuku_gap_browser.mjs tests/test_game_gap_webgl_browser.mjs
      - name: Check actual Xvfb WebGL input across gap transitions
        env:
          SOREN_OVERLAY_XVFB_TESTS: '1'
          SOREN_OVERLAY_ARTIFACT_DIR: ${{ runner.temp }}/overlay-v2-screens
        run: |
          # Hosted runners may route via a throttled Azure apt mirror. Prefer
          # the canonical Ubuntu mirror for the large FFmpeg codec packages;
          # preserve real X11/FFmpeg validation rather than skipping the test.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb ffmpeg openbox
          xvfb-run -a -s '-screen 0 1280x720x24' bash <<'SH'
          set -e
          openbox --sm-disable >/dev/null 2>&1 &
          test_wm_pid=$!
          trap 'kill "$test_wm_pid" 2>/dev/null || true' EXIT
          node --test tests/test_game_gap_webgl_browser.mjs
          SH
      - name: Save synthetic rendering evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: overlay-v2-synthetic-screens
          path: ${{ runner.temp }}/overlay-v2-screens
          if-no-files-found: error
      - name: Run game lifecycle shell regression
        run: bash tests/test_game_lifecycle.sh

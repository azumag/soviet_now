name: Temporary Soren91 README cleanup

on:
  push:
    branches: [cleanup/remove-soren91-readme-stubs]
    paths: [.github/soren91-readme-cleanup.trigger]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: trigger soren91 readme cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-soren91-readme-stubs
          fetch-depth: 0
      - name: Replace retired Soren91 self-improvement docs
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          reps = [
            ("    ├── strategy.mjs       ← ドロップ位置決定 (AI改変対象)\n    ├── improve.mjs        ← AI改善ループ\n    └── soren91_control.sh ← 親ループからの起動・停止・改善キック管理",
             "    ├── strategy.mjs       ← ドロップ位置決定（変更は明示的な人手/PRのみ）\n    └── soren91_control.sh ← 親ループからの起動・停止・手動メリケンモード管理"),
            ("node main.mjs        # ゲーム起動 → 自動プレイ → 12ゲームごとにAI改善\n```",
             "node main.mjs        # ゲーム起動 → 自動プレイ\n```\n\nSoren91 の自己改善・日次自動改善は廃止済み。`strategy.mjs` の変更は、明示的な人手作業またはレビュー付きPRとしてのみ行う。試合履歴・スクリーンショット等の証拠保存は手動分析用として継続する。"),
            ("| `soren91/strategy.mjs` | ドロップ位置決定 (AI改変対象) |\n| `soren91/improve.mjs` | ラウンド後AI改善ループ (claude -p --model haiku)。スモークテスト3ケース + ESLint no-undef 静的解析でバリデーション |",
             "| `soren91/strategy.mjs` | ドロップ位置決定（変更は明示的な人手/PRのみ） |"),
          ]
          for old, new in reps:
            n = s.count(old)
            if n != 1:
              raise SystemExit(f'exact replacement count mismatch: {n} for {old[:70]!r}')
            s = s.replace(old, new)
          for needle in ('soren91/improve.mjs', '12ゲームごとにAI改善', '改善キック管理'):
            if needle in s:
              raise SystemExit(f'retired Soren91 doc remains: {needle}')
          p.write_text(s, encoding='utf-8')
      - name: Validate bounded diff and commit
        run: |
          rm -f .github/soren91-readme-cleanup.trigger .github/workflows/temporary-soren91-readme-cleanup.yml
          git diff --check
          test "$(git diff --name-only | sort)" = "README.md"
          git diff -- README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/soren91-readme-cleanup.trigger .github/workflows/temporary-soren91-readme-cleanup.yml
          git commit -m 'docs(soren91): remove retired self-improvement instructions'
          git push origin HEAD:cleanup/remove-soren91-readme-stubs

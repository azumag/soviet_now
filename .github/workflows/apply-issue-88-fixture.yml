name: Apply issue 88 fixture patch

on:
  pull_request:
    paths:
      - '.github/workflows/apply-issue-88-fixture.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/88-outbound-priority-order
          fetch-depth: 0
      - name: Update isolated outbound queue fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          split_test = Path('tests/test_outbound_queue_youtube_split.py')
          text = split_test.read_text(encoding='utf-8')
          old = '        shutil.copy2(ROOT / "lib" / "outbound_queue.sh", self.work / "lib" / "outbound_queue.sh")\n'
          new = old + '        shutil.copy2(ROOT / "lib" / "outbound_queue_order.py", self.work / "lib" / "outbound_queue_order.py")\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected youtube split fixture shape')
          split_test.write_text(text.replace(old, new), encoding='utf-8')

          runtime_test = Path('tests/test_runtime_audio_fence.py')
          text = runtime_test.read_text(encoding='utf-8')
          old = "        for name in ('outbound_queue.sh', 'runtime_audio_fence.py'):\n"
          new = "        for name in ('outbound_queue.sh', 'outbound_queue_order.py', 'runtime_audio_fence.py'):\n"
          if text.count(old) != 1:
              raise SystemExit('unexpected runtime audio fixture shape')
          runtime_test.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run affected queue regressions
        run: |
          python3 -m unittest discover -s tests -p test_outbound_queue_youtube_split.py -v
          python3 -m unittest tests.test_runtime_audio_fence -v
          python3 -m unittest tests.test_outbound_queue_priority -v
      - name: Check shell syntax
        run: bash -n lib/outbound_queue.sh
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-issue-88-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: include outbound queue ordering helper in fixtures'
          git push origin HEAD:fix/88-outbound-priority-order

name: Overlay queue
on:
  pull_request:
    paths: ['overlay_notify.sh', 'generate_event_overlay.py', 'tests/test_overlay_notify_lock.py', '.github/workflows/overlay-queue.yml']
  push:
    branches: [main]
    paths: ['overlay_notify.sh', 'generate_event_overlay.py', 'tests/test_overlay_notify_lock.py', '.github/workflows/overlay-queue.yml']
permissions:
  contents: read
jobs:
  native-writer:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest tests.test_overlay_notify_lock tests.test_overlay_text
      - run: bash -n overlay_notify.sh

name: Prediction ownership development
on:
  push:
    branches: [fix/prediction-remote-ownership-20260930]
    paths: [.github/workflows/prediction-ownership-development.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'azumag/soviet_now' && github.ref == 'refs/heads/fix/prediction-remote-ownership-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Apply narrow source and regression changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('twitch_predictions.sh')
          source = p.read_text()
          begin = source.index('_recover_remote_active_prediction() {')
          end = source.index('\n_prediction_state_stale_reason()', begin)
          body = source[begin:end]
          body = body.replace('import json, sys\n', 'import json, re, sys\n', 1)
          old = '''for pred in data.get("data", []):
              if pred.get("status") not in {"ACTIVE", "LOCKED"}:
                  continue
              outcomes = [str(item.get("id", "")) for item in pred.get("outcomes", []) if item.get("id")]
              if len(outcomes) < 2 or not pred.get("id"):
                  continue
          '''
          new = '''# SOREN_REMOTE_PREDICTION_OWNERSHIP_V1: never adopt another corner's wager.
          if not isinstance(data, dict) or not isinstance(data.get("data"), list):
              raise SystemExit(1)
          expected = ["建国なし", "ロシア建国(ソ連不成立)", "ソ連建国", "粛清"]
          for pred in data["data"]:
              if not isinstance(pred, dict) or pred.get("status") not in {"ACTIVE", "LOCKED"}:
                  continue
              title, items = pred.get("title"), pred.get("outcomes")
              if (not isinstance(title, str) or not re.fullmatch(r"次の[1-9][0-9]{0,3}試合で建国できる？", title)
                      or not isinstance(items, list) or len(items) != 4
                      or not all(isinstance(item, dict) for item in items)
                      or [item.get("title") for item in items] != expected):
                  continue
              outcomes = [item.get("id") for item in items]
              if (not isinstance(pred.get("id"), str) or not 1 <= len(pred["id"]) <= 128
                      or not all(isinstance(value, str) and 1 <= len(value) <= 128 for value in outcomes)
                      or len(set(outcomes)) != 4):
                  continue
          '''
          assert body.count(old) == 1, 'source changed; inspect before editing'
          body = body.replace(old, new, 1)
          p.write_text(source[:begin] + body + source[end:])
          p = Path('tests/test_prediction_worker_gate.py')
          tests = p.read_text()
          addition = '''
          class RemotePredictionOwnershipTests(unittest.TestCase):
              def recover(self, rows):
                  import sys
                  source = _extract_function(PREDICTION_SCRIPT.read_text(), "_recover_remote_active_prediction")
                  marker = 'prediction_id=$(python3 - "$remote_json" <<' + "'PY' 2>/dev/null\\n"
                  program = source.split(marker, 1)[1].split("\\nPY", 1)[0]
                  result = subprocess.run([sys.executable, "-c", program, json.dumps({"data": rows})],
                                          capture_output=True, text=True, timeout=5)
                  self.assertEqual(result.returncode, 0, result.stderr)
                  return json.loads(result.stdout) if result.stdout.strip() else None
          
              def own(self, status="ACTIVE"):
                  labels = ["建国なし", "ロシア建国(ソ連不成立)", "ソ連建国", "粛清"]
                  return {"id": "soren", "title": "次の48試合で建国できる？", "status": status,
                          "outcomes": [{"id": str(i), "title": label} for i, label in enumerate(labels)]}
          
              def test_recovers_only_soren_active_and_locked(self):
                  for status in ("ACTIVE", "LOCKED"):
                      with self.subTest(status=status):
                          result = self.recover([self.own(status)])
                          self.assertEqual(result["prediction_id"], "soren")
                          self.assertEqual(result["outcome_ids"], ["0", "1", "2", "3"])
                          self.assertTrue(result["recovered"])
          
              def test_hanjuku_and_unrelated_predictions_are_not_adopted(self):
                  for status in ("ACTIVE", "LOCKED"):
                      row = {"id": "hanjuku", "title": "半熟英雄：どこまでゲーム到達できるか？ #abcdef123456",
                             "status": status, "outcomes": [{"id": str(i), "title": label} for i, label in
                             enumerate(["2話突破（新記録）", "1話突破", "1話突破できず"])]}
                      self.assertIsNone(self.recover([row]))
                      row = self.own(status)
                      row["title"] = "別の番組の予想"
                      self.assertIsNone(self.recover([row]))
          
              def test_rejects_wrong_order_missing_duplicate_and_nonstring_ids(self):
                  cases = []
                  row = self.own(); row["outcomes"].reverse(); cases.append(row)
                  row = self.own(); row["outcomes"].pop(); cases.append(row)
                  row = self.own(); row["outcomes"][1]["id"] = "0"; cases.append(row)
                  row = self.own(); row["outcomes"][0]["id"] = 0; cases.append(row)
                  row = self.own(); row["id"] = True; cases.append(row)
                  row = self.own(); row["title"] = "次の0試合で建国できる？"; cases.append(row)
                  row = self.own(); row["outcomes"] = {}; cases.append(row)
                  for row in cases:
                      with self.subTest(row=row):
                          self.assertIsNone(self.recover([row]))
          
              def test_legacy_twelve_game_round_and_ended_remote(self):
                  row = self.own(); row["title"] = "次の12試合で建国できる？"
                  self.assertEqual(self.recover([row])["prediction_id"], "soren")
                  for status in ("RESOLVED", "CANCELED"):
                      self.assertIsNone(self.recover([self.own(status)]))
          
              def test_skips_unrelated_entry_without_claiming_it(self):
                  other = self.own(); other["title"] = "半熟英雄"
                  self.assertEqual(self.recover([None, other, self.own()])["prediction_id"], "soren")
          
          '''
          marker = 'if __name__ == "__main__":'
          assert tests.count(marker) == 1
          p.write_text(tests.replace(marker, addition + marker, 1))
          PY
      - name: Offline prediction regressions
        run: |
          bash -n twitch_predictions.sh
          python3 -m unittest discover -s tests -p 'test_prediction*.py'
          python3 -m unittest discover -s tests -p 'test_corner_boundary.py'
          git diff --check
      - name: Commit feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitch_predictions.sh tests/test_prediction_worker_gate.py
          git commit -m 'fix(predictions): recover only verified Soren prediction outcomes'
          git push origin HEAD:refs/heads/fix/prediction-remote-ownership-20260930

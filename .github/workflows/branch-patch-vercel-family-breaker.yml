name: Branch patch Vercel family breaker

on:
  push:
    branches:
      - codex/vercel-family-breaker

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/vercel-family-breaker
      - name: Apply scoped family breaker patch
        run: python3 dev_patch_vercel_family_breaker.py
      - name: Run focused regressions
        run: |
          bash tests/test_ai_prepass_backoff_scope.sh
          bash tests/test_ai_dispatch_diagnostics.sh
          bash -n lib/ai_generate_policy.sh tests/test_ai_prepass_backoff_scope.sh
      - name: Commit tested patch to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/ai_generate_policy.sh tests/test_ai_prepass_backoff_scope.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'fix(ai): break repeated Vercel family 429 chains'
          git push origin HEAD:codex/vercel-family-breaker

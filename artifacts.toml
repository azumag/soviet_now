# artifacts.toml — top-level artifact inventory (soviet_now#146)
# 削除しない棚卸し。各エントリは owner/class/source_of_truth/rebuild/retention
# を持つ。分類不能なものは doctor が unknown-needs-owner として報告する。
# glob は top-level のみ（** 不可）。複数マッチ時は先勝ち。

[[artifact]]
pattern = ".git*"
owner = "repo"
class = "vcs"
source_of_truth = "git"
rebuild = "n/a"
retention = "keep"

[[artifact]]
pattern = "*.md"
owner = "docs"
class = "doc"
source_of_truth = "git"
rebuild = "n/a"
retention = "keep"

[[artifact]]
pattern = "handoff*"
owner = "ops"
class = "handoff"
source_of_truth = "local-private"
rebuild = "no"
retention = "rotate"
note = "private canonical handoff / archive"

[[artifact]]
pattern = "broadcast"
owner = "runtime"
class = "source"
source_of_truth = "git"
rebuild = "n/a"
retention = "keep"

[[artifact]]
pattern = "lib"
owner = "runtime"
class = "source"
source_of_truth = "git"
rebuild = "n/a"
retention = "keep"

[[artifact]]

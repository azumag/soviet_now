source_of_truth = "git"
rebuild = "n/a"
retention = "keep"

[[artifact]]
pattern = "strategy.py"
owner = "improve"
class = "live-strategy"
source_of_truth = "reviewed-gitlineage"
rebuild = "via upstream PR + docich gitlink"
retention = "keep"
note = "projection live-apply gate の対象（#2482/#707）。未review bytes は refuse+quarantine"

[[artifact]]
pattern = "strategy_versions*"
owner = "improve"
class = "generated"
source_of_truth = "runtime"
rebuild = "no"
retention = "rotate"
max_size_mb = 500

